# MIST-2 control system: single source of truth for the rebuild at IBA.
#
# Edit this file, then run   python build.py   to regenerate the sketches (out/*.svg, *.png, *.pdf)
# and the Word document (out/MIST-2_Control_System_Plan.docx).
#
# status values:
#   keep     stays as it is
#   modify   stays, but firmware / interface / database changes
#   replace  will be removed, a new device takes over
#   new      to be added
#   later    phase 2 (dipole scan, emittance scanners)
#   tbd      not decided, or not enough information yet
#
# Existing PVs are read from the EPICS databases in EPICS/Db, with the macros given under "epics"
# (one database load, or a list of them). build.py compares these loads with the dbLoadRecords
# lines of the st.cmd files named by the hosts and warns about every difference.
# Only PVs that do not exist yet are listed here, under "proposed".
#
# The section "databases" at the end gives every record of a database a role (what the GUI and
# the tests ask for) or marks it internal. plan/registry.py writes the registry for the GUI and
# the tests from this file, the databases and the st.cmd files.

meta:
  title: "MIST-2 Control System Rebuild at IBA"
  subtitle: "Device inventory, connections, process variables and work plan"
  revision: "0.7"
  date: "2026-11-21"
  author: "D. Winklehner"
  basis:
    - "Device list 'MIST-2 Devices Comm Protocols' (docx)"
    - "EPICS databases and st.cmd in github.com/DanielWinklehner/rfq-dip-epics (branch libcom1-robustness-fixes)"
    - "Decisions taken so far: acknowledged sets, PLCs where possible, Linux IOCs"
    - "Notes of 2026-11-21: MFC interface, gauge controller replacement, valves to Opta, REK150-55-L(400V), CO-E32 later, GUI overhaul, second optical adapter (USB-OPT)"
    - "Revision 0.7: the databases in EPICS/Db and the two st.cmd files of branch emulated-iocs (PV names of the lab's IOC of 2023), the design note docs/emulation/DESIGN.md (G1, approved 2026-11-21) and the assumptions A1 to A22 and open points in docs/emulation/STATUS.md"

phases:
  - id: 1
    name: "Phase 1: ion source re-commissioning"
    text: "Source, extraction, vacuum, gas, cooling, interlocks and Faraday cup. No dipole, probably no emittance scanners."
  - id: 2
    name: "Phase 2: beam characterization"
    text: "Dipole scan (today LabVIEW) and emittance scanners (today Python/Flask) moved to EPICS with one common scan tool."

network:
  name: "Control network"
  text: "New Ethernet switch (model tbc), fiber to both IOCs"

locations:
  - {id: control, name: "Control room / desk"}
  - {id: rack, name: "Equipment rack (ground potential)"}
  - {id: hv, name: "High-voltage platform"}
  - {id: emit, name: "Emittance scanner rack"}

hosts:
  - id: lab_pc
    name: "Lab computer"
    location: control
    role: "Serves the GUI (React Automation Studio). Runs the LabVIEW dipole scan."
    os: "Windows"
    uplink: "Ethernet"
    status: keep
  - id: ioc_rack
    name: "Rack IOC"
    model: "1U server"
    location: rack
    role: "EPICS IOC for everything in the rack"
    os: "Windows today, Linux planned"
    uplink: "Fiber to the new switch"
    status: modify
    change: "Move from Windows to Linux"
    st_cmd: EPICS/ioc/iocBoot/iocRack/st.cmd
    epics: {db: ioc_info.db, macros: {P: IOC-RACK}}
    notes:
      - "Windows is only needed for the Matsusada CO-U32 driver. See work package WP4."
      - "EPICS/ioc/iocBoot/iocRack/st.cmd is the same file for the emulation and for this computer. The asyn ports come from ports.sim.cmd or ports.real.cmd. The Linux device names in ports.real.cmd are placeholders until the udev rules exist (assumption A21)."
    questions:
      - "Which COM ports does the running IOC use? Please send st.cmd and the output of dbl."
  - id: ioc_hv
    name: "HV platform IOC"
    model: "ASUS mini PC"
    location: hv
    role: "EPICS IOC for the supplies on the high-voltage platform"
    os: "?"
    uplink: "Fiber to the new switch (the only link that crosses to the platform)"
    status: keep
    st_cmd: EPICS/ioc/iocBoot/iocHV/st.cmd
    epics: {db: ioc_info.db, macros: {P: IOC-HV}}
    notes:
      - "Assumed (A22): it runs the same EPICS top as the rack IOC (EPICS/ioc, st.cmd in iocBoot/iocHV)."
    questions:
      - "Operating system of the mini PC? Please send its st.cmd and dbl output as well."
  - id: emit_pc
    name: "Emittance scanner PC"
    model: "Small form-factor PC"
    location: emit
    role: "Python server (Flask), no EPICS"
    os: "?"
    uplink: "Ethernet"
    status: later

adapters:
  - id: co_u32
    name: "Matsusada CO-U32"
    text: "USB to optical fiber, up to 32 supplies"
    host: ioc_rack
    link: "USB (virtual COM port, 9600 baud)"
    status: modify
  - id: usb_opt
    name: "Matsusada USB-OPT"
    text: "USB to optical fiber, second chain"
    host: ioc_rack
    link: "USB (virtual COM port)"
    status: new
  - id: ni_desk
    name: "NI USB-6001"
    text: "analog I/O"
    host: lab_pc
    link: "USB"
    status: later
  - id: ni_emit
    name: "NI USB-6001"
    text: "analog out + HV amplifier"
    host: emit_pc
    link: "USB"
    status: later

subsystems:
  # page: the GUI page of the devices of this subsystem (docs/emulation/gui/LAYOUT.md 1.5)
  - {id: source, name: "Plasma generator (HV platform)", phase: 1, page: "Plasma generator"}
  - {id: hv, name: "Extraction and beam optics high voltage", phase: 1, page: "Extraction"}
  - {id: vacuum, name: "Vacuum and gas", phase: 1, page: "Vacuum and gas"}
  - {id: cooling, name: "Cooling and interlocks", phase: 1, page: "Cooling and interlocks"}
  - {id: diag, name: "Beam diagnostics", phase: 1, page: "Diagnostics"}
  - {id: scan, name: "Dipole scan and emittance scanners", phase: 2}

devices:
  # ------------------------------------------------------------------ plasma generator
  - id: fil_heat
    name: "Filament heating supply"
    model: "TDK-Lambda GENESYS 8-300 (8 V, 300 A)"
    subsystem: source
    location: hv
    host: ioc_hv
    link: "USB (RS-232/485 also available)"
    protocol: "StreamDevice, tdk.proto, 19200 baud"
    epics: {db: tdk.db, macros: {PORT: TDK, DEVICE: TDK, ADR: "6"}}
    status: keep
    notes:
      - "Sets are already acknowledged (the supply answers OK). A missing or negative answer now ends in an alarm on the set record."
      - "Power, mode and fault register, proposed in revision 0.6, exist now: TDK:power:get, TDK:mode:get, TDK:fault:get."
      - "Assumed (A8): address 6 and 19200 baud, from tdk.proto and the repository's st.cmd."
    questions:
      - "After a power cycle the supply comes back with its output off, while TDK:status:setpoint still shows ON until it is written again; TDK:status:get shows the truth (P10). Is that acceptable for the GUI and the discharge loop?"

  - id: fil_dis_old
    name: "Filament discharge supply (old)"
    model: "Matsusada REK150-24 (150 V, 24 A)"
    subsystem: source
    location: hv
    host: ioc_hv
    link: "RS-485 to USB adapter"
    protocol: "StreamDevice, rek.proto (Matsusada CO protocol), 9600 baud"
    epics: {db: rek.db, macros: {PORT: REK, UNITNUM: "1"}}
    status: replace
    notes:
      - "Replaced by the REK150-55."
      - "Assumed (A7): unit 1 on its own port, 9600 baud, as in the repository's st.cmd."
      - "The output follows the permit interlock_open of the rack IOC, read over Channel Access (macro PERMIT). Assumed (A19): this gate of the lab's 2023 database is still wanted."

  - id: fil_dis_new
    name: "Filament discharge supply (new)"
    model: "Matsusada REK150-55-L(400V) (150 V, 55 A, 8.3 kW), no communication options"
    subsystem: source
    location: hv
    host: ioc_hv
    link: "Matsusada digital interface port, through an external CO adapter"
    protocol: "Matsusada CO protocol (rek.proto), same as the old unit"
    status: new
    inherits_pvs_from: fil_dis_old
    proposed:
      - {name: "REK-1:mode:read", type: mbbi, desc: "CV / CC mode", remark: "not built: the CO command set has no command for it, STS reports only output on/off and remote/local (DESIGN.md 3)"}
      - {name: "REK-1:alarm:read", type: longin, desc: "Alarm / cutoff cause", remark: "not built: the CO command set has no command for it (DESIGN.md 3)"}
    options:
      - {name: "CO-MET4-25", text: "RS-485 adapter (25-pin D-sub)", interface: "RS-485", note: "Probably what the REK150-24 uses today. Then nothing changes but the supply."}
      - {name: "CO-MET2-9 / -25", text: "RS-232C adapter", interface: "RS-232C", note: ""}
      - {name: "CO-U32m", text: "USB adapter for the modular port", interface: "USB", note: "Not the CO-U32 in the rack: that one is for supplies with the optical port."}
      - {name: "CO-E32m", text: "LAN adapter for the modular port", interface: "Ethernet", note: "Cleanest for a Linux IOC. Check delivery time."}
    notes:
      - "Baseline remote control of a REK without options (Matsusada product page): the proprietary digital interface port with modular IN and OUT jacks, which always needs an external adapter, plus the external analog remote control terminals. Built-in LAN, USB or RS-485 would have needed the -LMi option."
      - "Proposal: keep the PV names REK-1:* so that the GUI does not change."
      - "Done in rek.db: full scale is a macro (VFS 150 V, IFS 24 A by default), so for the 55 A unit the st.cmd line gets IFS=55. Without it every current would be wrong by a factor 2.3. The current PVs now carry the unit A (they said mA)."
      - "Matsusada states that the input-voltage variants, -L(400V) among them, do not carry CE marking. Worth telling IBA's safety group before installation."
    questions:
      - "Which adapter sits between the RS-485 to USB converter and the REK150-24 today (label on the box)? Does the new unit have the same modular port?"
      - "8.3 kW on the platform at 400 V three-phase: is the isolation transformer and the platform mains sized for it?"

  - id: thermo_hv
    name: "Thermocouple readout"
    model: "Arduino based"
    subsystem: source
    location: hv
    host: ioc_hv
    link: "USB"
    protocol: "libcom1"
    epics:
      - {db: thermocouples.db, macros: {PORT: thermo, DEVICE: THM}}
      - {db: libcom1_device.db, macros: {PORT: thermo, DEVICE: THM}}
    status: modify
    libcom1: true
    labels: {t1: "Temp Sensor 1", t2: "Back Plate Temp", t3: "Magnet Plate Temp", t4: "Temp Sensor 4"}
    notes:
      - "The board sends 16 channels. t1 to t4 (degC), the cold junctions j1 to j4 and the fault codes f1 to f4 have PVs, the junction fault codes a1 to a4 do not. A faulted thermocouple reads INVALID."
      - "Labels t1 to t4 are those of the lab GUI of 2023 (RAS/Devices.js)."
      - "Assumed (A9): 19200 baud as in the firmware; the repository's and the lab's st.cmd say 9600."
    questions:
      - "What do t1 and t4 measure? The lab GUI names only t2 (back plate) and t3 (magnet plate)."

  # ------------------------------------------------------------------ high voltage
  - id: au_src
    name: "Ion source voltage"
    model: "Matsusada AU20P15 (+20 kV, 15 mA) with CO-HV"
    subsystem: hv
    location: rack
    host: ioc_rack
    via: usb_opt
    link: "optical fiber (chain assignment is a proposal)"
    protocol: "StreamDevice, matsusada_co_ctrl.proto"
    epics: {db: matsusada_au20p7.db, macros: {PORT: mat_opt, UNITNUM: "1", IFS: "15"}}
    status: modify
    change: "Second optical chain, slimmer polling, scaling fix into the repository"
    notes:
      - "Why the update rate drops with every supply: the CO protocol returns one value per request, each request addresses one supply, and all supplies of a chain share one 9600 baud port. One request plus reply is about 20 characters, so about 20 ms on the wire before any turnaround time."
      - "The lab's matsusada_au20p7.db of 2023 polls five values per supply every 0.1 s (set-point echo and monitor for voltage and current, plus status). That is 50 requests per second for a single supply, more than the chain can carry. With N supplies every value updates N times slower."
      - "Fix 1, built in the reworked matsusada_au20p7.db: only the two monitors (MN1, MN2) are polled fast. The set-point echoes (CH0?, CH1?) are read after each set and every few seconds, the status once a second. That is 2 fast requests per supply instead of 5. Each supply reads its two monitors as one cycle and waits its turn on the line, so all supplies of a chain update at the same rate (measured 9.1 Hz with two supplies at 5 ms turnaround, 6.1 Hz at 16 ms)."
      - "Fix 2, built: two chains on two asyn ports (mat_opt behind the USB-OPT, mat_co behind the CO-U32), polled in parallel. Put the supplies that need the fastest read-back on the short chain."
      - "Fix 3, built: the set records have PRIO = HIGH, so that a command overtakes the queued polls instead of waiting behind them."
      - "Check the USB latency timer of both adapters' COM ports (16 ms by default on FTDI-type ports, 1 ms is possible). The turnaround time of the real adapters is not known: the simulator assumes 5 ms (A6)."
      - "Proposal for the split: source voltage and puller on the short USB-OPT chain, because their currents show beam loading and sparks first. The lenses stay on the CO-U32. The emulation is built that way (assumed, A3)."
      - "The AU20P15 reads correctly today (front panel and control system agree), so its 15 mA scaling was fixed locally. matsusada_au20p7.db now takes the full scale as macros (VFS, IFS), and st.cmd sets IFS=15 for this unit. Assumed (A4): the same 16-bit set and 12-bit monitor scaling as the P7.5; the lab's local fix has not been seen."
      - "Unit 1, from the lab's st.cmd of 2023 (A2: to be confirmed with the current lab files)."
      - "For all AU supplies and the REK: the output follows the permit interlock_open (macro PERMIT), as in the lab's database of 2023 (assumed still wanted, A19). A set-point write in the first 5 s after an IOC start is not sent to the supply, because the databases first take over the supply's own settings (P20)."
      - "The PV prefix AU-20P7-<n> is wrong for this unit (it is a P15) and for the negative ones. Another reason to name PVs by function: source, puller, lens 1 to 3."
    questions:
      - "All AU supplies and the REK: switching an output on sends ICN 100, which sets the current limit to 100 % of full scale whatever current:setpoint holds (the lab's sequence, kept, macro ICN_ON). Is that wanted (P17)?"
      - "All AU supplies and the REK: they are put into remote mode (REN) with every status poll, so that a supply that was switched off and on comes back by itself. The front panel then cannot take local control while the IOC runs; the lab sent REN only at start and on switching. Keep it (P19)?"

  - id: au_puller
    name: "Puller"
    model: "Matsusada AU20N7.5 (-20 kV, 7.5 mA) with CO-HV"
    subsystem: hv
    location: rack
    host: ioc_rack
    via: usb_opt
    link: "optical fiber (chain assignment is a proposal)"
    protocol: "StreamDevice, matsusada_co_ctrl.proto"
    epics: {db: matsusada_au20p7.db, macros: {PORT: mat_opt, UNITNUM: "2"}}
    status: modify
    change: "Second optical chain, database into the repository"
    notes:
      - "Unit 2 and the PV names AU-20P7-2:*, from the lab's st.cmd of 2023 (A2: to be confirmed with the current lab files)."
      - "The PVs show positive numbers, as the lab's database does (decision D3, assumption A5). The macro POL=- would show the sign."

  - id: au_lens1
    name: "Lens 1"
    model: "Matsusada AU20P7.5 (+20 kV, 7.5 mA) with CO-HV"
    subsystem: hv
    location: rack
    host: ioc_rack
    via: co_u32
    link: "optical fiber"
    protocol: "StreamDevice, matsusada_co_ctrl.proto"
    epics: {db: matsusada_au20p7.db, macros: {PORT: mat_co, UNITNUM: "3"}}
    status: modify
    change: "Slimmer polling"
    notes:
      - "Unit 3, from the lab's st.cmd of 2023 (A2: to be confirmed with the current lab files). The repository's older st.cmd called unit 2 'Einzel Lens'; in the 2023 file unit 2 is the puller."

  - id: au_lens2
    name: "Lens 2"
    model: "Matsusada AU20N7.5 (-20 kV, 7.5 mA) with CO-HV"
    subsystem: hv
    location: rack
    host: ioc_rack
    via: co_u32
    link: "optical fiber"
    protocol: "StreamDevice, matsusada_co_ctrl.proto"
    epics: {db: matsusada_au20p7.db, macros: {PORT: mat_co, UNITNUM: "5"}}
    status: modify
    change: "Slimmer polling, database into the repository"
    flags: {assumed: "Unit 5 is a guess (A2): the lab's st.cmd of 2023 loads units 1 to 4 only"}
    notes:
      - "Assumed (A2): unit 5, so the PV names are AU-20P7-5:*. The lab's st.cmd of 2023 loads units 1 to 4 only."
      - "The PVs show positive numbers, as the lab's database does (decision D3, assumption A5). The macro POL=- would show the sign."

  - id: au_lens3
    name: "Lens 3 (not in use)"
    model: "Matsusada AU20P7.5 (+20 kV, 7.5 mA) with CO-HV"
    subsystem: hv
    location: rack
    host: ioc_rack
    via: co_u32
    link: "optical fiber"
    protocol: "StreamDevice, matsusada_co_ctrl.proto"
    epics: {db: matsusada_au20p7.db, macros: {PORT: mat_co, UNITNUM: "4", SCAN_MON: Passive, SCAN_GET: Passive, SCAN_STS: Passive}}
    status: tbd
    flags: {not_polled: "Installed but not in use: its records are loaded with scanning off"}
    notes:
      - "The latest extraction system has no lens 3 (electrode grounded). Do not poll this supply while it is unused: every polled supply slows its chain."
      - "Built that way: its records are loaded with scanning off (Passive), nothing polls it. Unit 4, from the lab's st.cmd of 2023 (A2)."
    questions:
      - "Keep the lens 3 supply connected as a spare, or take it off the chain?"
      - "Unit numbers of all five supplies: 1 to 4 are from the lab's st.cmd of 2023, 5 (lens 2) is a guess (A2). Please confirm them from the front panels or the lab files."

  - id: hv_alloff
    name: "All HV off"
    model: "One command to both optical chains (#AL SW0)"
    subsystem: hv
    location: rack
    host: ioc_rack
    link: "both optical chains"
    protocol: "StreamDevice, matsusada_co_ctrl.proto (multiple command #AL)"
    epics: {db: au_alloff.db, macros: {PORT1: mat_opt, PORT2: mat_co, R1: "AU-20P7-1:SetToggleOutput", R2: "AU-20P7-2:SetToggleOutput", R3: "AU-20P7-3:SetToggleOutput", R4: "AU-20P7-5:SetToggleOutput", R5: "AU-20P7-4:SetToggleOutput"}}
    status: new
    notes:
      - "Proposed in revision 0.6 under the ion source supply, built as AU:alloff:set: sends #AL SW0 on both chains and clears the output request of every supply listed in R1 to R5, so that one write of 1 switches a supply on again."

  # ------------------------------------------------------------------ vacuum and gas
  - id: mfc
    name: "Mass flow controller"
    model: "MKS GV50A"
    subsystem: vacuum
    location: rack
    host: ioc_rack
    link: "RS-485 multi-drop, 9-pin D-sub, through an FTDI USB to RS-485 adapter (power spliced in from a small supply)"
    protocol: "MKS RS-485 protocol"
    epics: {db: mfc.db, macros: {PORT: MFC, DEVICE: MFC, ADDR: "254"}}
    status: keep
    notes:
      - "Works as it is, no change planned."
      - "The Ethernet port of the unit is for setup only, not for control."
      - "mfc.db and mfc.proto are now in the repository: the lab's draft of 2023 (set point only, commented out in its st.cmd), completed from the MKS RS-485 supplement 1046411-001 Rev. A. Sets are acknowledged. The set point is in percent of full scale, MFC:getFlow in flow units (sccm)."
      - "Assumed (A11): address 254 and 9600 baud, as in the lab's draft. MFC:getFlow is a new name in the lab's style (A12)."
    questions:
      - "Please send the MFC files that run in the lab, so that mfc.db can be compared with them (A11)."
      - "The MKS supplement does not show the reply to a set (with or without the value) or an example of a negative reply. The protocol file accepts both forms of the positive reply. What does the unit answer (P11)?"

  - id: gauge_ctrl
    name: "Gauge controller (homemade)"
    model: "Arduino based, for Edwards APG and AIM"
    subsystem: vacuum
    location: rack
    host: ioc_rack
    link: "USB"
    protocol: "libcom1"
    epics:
      - {db: pressure.db, macros: {PORT: AVR6, DEVICE: PRESSURE}}
      - {db: libcom1_device.db, macros: {PORT: AVR6, DEVICE: PRESSURE}}
    status: replace
    labels: {apg: "APG Pressure", diag_box: "Diagnostic Box Pressure"}
    notes:
      - "To be replaced by an off-the-shelf controller."
      - "Two channels in torr: p1 the Pirani gauge (APG, PRESSURE:apg:getpressure), p2 the ion gauge (AIM, PRESSURE:diag_box:getpressure, the diagnostic box in the lab's names). Labels from the lab GUI of 2023."
      - "The firmware keeps sending the last pressure after a gauge was switched off at the box, so a pressure value does not prove that the gauge is on (P6)."
      - "Assumed (A10): 115200 baud, no parity, as in the Arduino Mega firmware IonGaugeController. The lab's st.cmd says even parity."
    questions:
      - "Which firmware runs in the lab: IonGaugeController (Arduino Mega, 8N1) or IonGaugeController_Teensy? The lab's st.cmd calls it a Teensy and sets even parity; the emulator follows the Mega sketch (P2)."

  - id: gauge_new
    name: "Gauge controller (off the shelf)"
    model: "tbd, see options"
    subsystem: vacuum
    location: rack
    host: ioc_rack
    link: "tbd (RS-232/485 or Ethernet, depending on the choice)"
    protocol: "StreamDevice, protocol file per controller"
    status: new
    inherits_pvs_from: gauge_ctrl
    proposed:
      - {name: "gauge:aim:enable:set", type: bo, desc: "Cold-cathode gauge on / off"}
      - {name: "gauge:<n>:state:get", type: mbbi, desc: "Gauge state (off, striking, on, error)"}
      - {name: "gauge:relay<n>:get", type: bi, desc: "Set-point relay state (also an interlock input)"}
    options:
      - {name: "A1: Edwards TIC Instrument Controller", text: "3 or 6 Edwards active gauges. Keeps the APG and AIM heads.", interface: "RS-232 and RS-485", note: "Recommended if the pumps are not Edwards. Same protocol family as the nAIM. Set-point outputs for the interlock."}
      - {name: "A2: Edwards TIC Turbo and Instrument Controller", text: "As A1, and also runs an Edwards turbopump and its backing pump.", interface: "RS-232 and RS-485", note: "Not applicable: the turbopumps run on Leybold NT 20 converters."}
      - {name: "A3: no controller", text: "Feed the gauges with 24 V and read their 0-10 V signal with the PLC.", interface: "analog", note: "Cheapest. Needs an accurate analog input (Opta expansion, not the base inputs)."}
      - {name: "B1: Pfeiffer TPG 366 (or TPG 361/362)", text: "6 (or 1/2) Pfeiffer ActiveLine gauges. New gauge heads needed, one full-range head replaces an APG and AIM pair.", interface: "Ethernet, RS-485, USB", note: "Best if the turbopumps are Pfeiffer, or if Ethernet matters most."}
      - {name: "B2: digital gauges without controller", text: "Transducers with their own serial or fieldbus port, as the nAIM already is.", interface: "RS-485 or EtherCAT", note: "Fewest boxes. New gauge heads needed. Fits a later EtherCAT migration."}
    notes:
      - "Proposal: keep the two pressure PV names (or alias them), add units and alarm limits (HIHI/HIGH) so that a bad vacuum shows as an alarm."
    questions:
      - "Which gauges stay: only the APG and the AIM, or more heads at IBA (how many channels)?"
      - "With Leybold NT 20 converters on the pumps, A1 is the recommendation. Agreed?"

  - id: naim
    name: "Ion gauge (digital)"
    model: "Edwards nAIM"
    subsystem: vacuum
    location: rack
    host: ioc_rack
    link: "homemade RS-232 to USB adapter with power feed"
    protocol: "StreamDevice, aim.proto, 9600 baud"
    epics: {db: aim.db, macros: {PORT: AIM, DEVICE: AIM}}
    status: keep
    labels: {p: "nAIM-S Ion Gauge Source Pressure"}
    notes:
      - "AIM:enable now waits for the gauge's answer, so a rejected or unanswered command raises an alarm."
      - "Assumed (A15): the gauge answers !C752 as in the Edwards manual, and the pressure is in torr as in the lab's database."
    questions:
      - "The nAIM instruction manual was not found. Please check on the gauge the protocol taken from INFICON's description (?V752 answered by pressure and a 4-digit status word, !C752 answered by *C752 0) (P7), and the pressure unit configured in the gauge (P8)."
      - "AIM:getpressure is INVALID while the gauge is off or striking (P9). Is another display preferred?"

  - id: turbo
    name: "Turbopump controllers"
    model: "2 x Leybold TURBOTRONIK NT 20, one Arduino Opta for both"
    subsystem: vacuum
    location: rack
    host: ioc_rack
    link: "remote-control inputs and status relays wired to an Opta, RS-232 monitor output in addition"
    protocol: "libcom1 over TCP (Opta) for start, stop, status. StreamDevice, listen only, for the RS-232 data"
    epics:
      - {db: turbo.db, macros: {PORT: TURBO, DEVICE: TURBO}}
      - {db: libcom1_device.db, macros: {PORT: TURBO, DEVICE: TURBO}}
    status: new
    flags: {assumed: "The Opta firmware does not exist yet: turbo.db defines its channel map (P13)"}
    options:
      - {name: "A: Opta on the remote-control terminals", text: "Start and stop through the remote inputs, normal-operation and failure relays read back.", interface: "digital I/O", note: "Recommended. The same relays feed the interlock."}
      - {name: "B: RS-232 monitor output", text: "The converter sends its internal values by itself, about every 8 s. Read only.", interface: "RS-232, listen only", note: "Add to A for speed and current. Data format has to be captured from a unit."}
      - {name: "C: replace by Turbo.Drive TD20 classic", text: "Leybold's successor, sold as a replacement for the NT 20.", interface: "RS-232, RS-485 or Profibus", note: "Only if full serial control is wanted."}
    notes:
      - "One set of PVs per pump (TURBO1:*, TURBO2:*, devices turbo1 and turbo2), and the identity of the Opta (TURBO:*). The PVs proposed in revision 0.6 (start, at speed, failure, speed, current, age) exist now with these prefixes."
      - "The NT 20 has no serial command interface: its RS-232 port only reports."
      - "Checked in the operating instructions GA 05.208/8: THREE status relays, NORMAL (speed above 80 % of the target speed), ACCEL and FAILURE (changeover: open when the controller has no power, closes on a failure). Remote inputs START (high-active) and STOP (low-active, dominant); a failure is reset by STOP, so there is no reset PV. RS-232: data output only, 9600 baud, all main parameters about every 8 s, format 'on request'."
      - "One Opta for both pumps (decision D7), wired as the 'ON/OFF switch' of Fig. 6: 2 of its 4 relays and 6 of its 8 inputs. The two spare relays could switch HEATING if the pumps have flange heaters."
      - "Assumed (P13): the Opta firmware does not exist yet. The channel map in turbo.db (r1 r2 r3 r4 n1 a1 f1 n2 a2 f2) is its specification."
    questions:
      - "Is the RS-232 port fitted on your two NT 20 units? Which TURBOVAC pumps do they drive?"

