  # GUI can show a subsystem without a page on the Infrastructure page alone (T17 report).
  - {id: services, name: "Control system services", phase: 1, page: "Diagnostics"}
  - {id: scan, name: "Dipole scan and emittance scanners", phase: 2}

devices:
  # ------------------------------------------------------------------ plasma generator
  - id: fil_heat
    name: "Filament heating supply"
    model: "TDK-Lambda GENESYS 8-300 (8 V, 300 A)"
    subsystem: source
    location: hv
    host: ioc_hv
    link: "USB (RS-232/485 also available)"
    protocol: "StreamDevice, tdk.proto, 19200 baud"
    epics: {db: tdk.db, macros: {PORT: TDK, DEVICE: TDK, ADR: "6"}}
    status: keep
    notes:
      - "Typical operating point (owner, 2026-11-21): 8 V and 90 A on the filament, 150 V and 24 A on the discharge, about 1e-5 torr in the six-way cross, mass flow controller at about 20 % of 5 sccm."
      - "The filament is a hairpin filament (owner, 2026-11-21)."
      - "Sets are already acknowledged (the supply answers OK). A missing or negative answer now ends in an alarm on the set record."
      - "Power, mode and fault register, proposed in revision 0.6, exist now: TDK:power:get, TDK:mode:get, TDK:fault:get."
      - "Assumed (A8): address 6 and 19200 baud, from tdk.proto and the repository's st.cmd."
    questions:
      - "After a power cycle the supply comes back with its output off, while TDK:status:setpoint still shows ON until it is written again; TDK:status:get shows the truth (P10). Is that acceptable for the GUI and the discharge loop?"

  - id: fil_dis_old
    name: "Filament discharge supply (old)"
    model: "Matsusada REK150-24 (150 V, 24 A)"
    subsystem: source
    location: hv
    host: ioc_hv
    link: "RS-485 to USB adapter"
    protocol: "StreamDevice, rek.proto (Matsusada CO protocol), 9600 baud"
    epics: {db: rek.db, macros: {PORT: REK, UNITNUM: "1"}}
    status: replace
    notes:
      - "Replaced by the REK150-55."
      - "Assumed (A7): unit 1 on its own port, 9600 baud, as in the repository's st.cmd."
      - "The output follows the permit interlock_open of the rack IOC, read over Channel Access (macro PERMIT), and latches (owner, 2026-11-21): see the ion source supply for the behaviour, which is the same in rek.db."
      - "A lost permit (the rack IOC stopped or silent) switches the output off as an open one does: the gate reads the permit through its own record REK-1:_permit:read, scanned every 0.1 s, which turns INVALID when the link is lost (a lost Channel Access link neither processes its record nor reaches a calculation). A silent rack IOC is noticed after EPICS_CA_CONN_TMO (5 s, iocHV/st.cmd) and an unanswered echo: about 10 s."
      - "Current limit REK-1:current:limit (alias current:setpoint, the lab's name), restored by autosave. Default in EPICS/ioc/iocBoot/iocHV/limits.defaults: 24 A, the full scale, not a limit for operation (to be set by the owner)."

  - id: fil_dis_new
    name: "Filament discharge supply (new)"
    model: "Matsusada REK150-55-L(400V) (150 V, 55 A, 8.3 kW), no communication options"
    subsystem: source
    location: hv
    host: ioc_hv
    link: "Matsusada digital interface port, through an external CO adapter"
    protocol: "Matsusada CO protocol (rek.proto), same as the old unit"
    status: new
    inherits_pvs_from: fil_dis_old
    proposed:
      - {name: "REK-1:mode:read", type: mbbi, desc: "CV / CC mode", remark: "not built: the CO command set has no command for it, STS reports only output on/off and remote/local (DESIGN.md 3)"}
      - {name: "REK-1:alarm:read", type: longin, desc: "Alarm / cutoff cause", remark: "not built: the CO command set has no command for it (DESIGN.md 3)"}
    options:
      - {name: "CO-MET4-25", text: "RS-485 adapter (25-pin D-sub)", interface: "RS-485", note: "Probably what the REK150-24 uses today. Then nothing changes but the supply."}
      - {name: "CO-MET2-9 / -25", text: "RS-232C adapter", interface: "RS-232C", note: ""}
      - {name: "CO-U32m", text: "USB adapter for the modular port", interface: "USB", note: "Not the CO-U32 in the rack: that one is for supplies with the optical port."}
      - {name: "CO-E32m", text: "LAN adapter for the modular port", interface: "Ethernet", note: "Cleanest for a Linux IOC. Check delivery time."}
    notes:
      - "Baseline remote control of a REK without options (Matsusada product page): the proprietary digital interface port with modular IN and OUT jacks, which always needs an external adapter, plus the external analog remote control terminals. Built-in LAN, USB or RS-485 would have needed the -LMi option."
      - "Proposal: keep the PV names REK-1:* so that the GUI does not change."
      - "Done in rek.db: full scale is a macro (VFS 150 V, IFS 24 A by default), so for the 55 A unit the st.cmd line gets IFS=55. Without it every current would be wrong by a factor 2.3. The current PVs now carry the unit A (they said mA)."
      - "Matsusada states that the input-voltage variants, -L(400V) among them, do not carry CE marking. Worth telling IBA's safety group before installation."
    questions:
      - "Which adapter sits between the RS-485 to USB converter and the REK150-24 today (label on the box)? Does the new unit have the same modular port?"
      - "8.3 kW on the platform at 400 V three-phase: is the isolation transformer and the platform mains sized for it?"

  - id: dis_loop
    name: "Discharge current loop"
    model: "PID loop: records EPICS/Db/loop.db, algorithm in the service loops/mist2loop"
    subsystem: source
    location: hv
    host: ioc_hv
    link: "records of the HV platform IOC; the loop service talks to them over Channel Access"
    protocol: "Channel Access"
    epics: {db: loop.db, macros: {P: LOOP-DIS, MEAS: "REK-1:current:read", ACT: "TDK:current:setpoint", HB: "IOC-HV:heartbeat",
                                  C1: interlock_open, R1: "0", W1: "interlock open", C2: "REK-1:status:read", R2: "1",
                                  W2: "REK not on in remote", C3: "TDK:status:get", R3: "1", W3: "TDK output off",
                                  EGU: A, OEGU: A, OLO: "0", OHI: "300", RES: "0.01", SCAN: ".2 second", DT: "0.2"}}
    status: new
    flags: {assumed: "The default gains come from the plant model of the emulation, not from MIST-2 (docs/emulation/LOOP.md)"}
    # The permits by what must hold (their records show "fulfilled", or the condition's words W1 to W3)
    labels: {permit1: "interlock closed", permit2: "REK on in remote control", permit3: "TDK output on"}
    states: {service: ["not alive", "alive"]}
    notes:
      - "Holds the discharge current (REK-1:current:read) at LOOP-DIS:value:setpoint through the filament heating current (TDK:current:setpoint). Step 1 of WP10: plain PID with output limits, slew limit, anti-windup, bumpless switching and hand-back to MANUAL."
      - "Two layers (owner's decision, 2026-11-22). The service loops/mist2loop (Python, pyepics) runs the PID and decides hand-backs and refusals. The records in this IOC are the interface and the backstop: they write the actuator only in PID, only within the output limits and the slew limit, and go to MANUAL with an alarm when the service's counter stands still (LOOP-DIS:service:get)."
      - "Hands back to MANUAL by itself (the request returns to MANUAL, latched): a permit fails (interlock open, REK not on in remote control, TDK output off), a PV it uses is INVALID or not connected, the IOC's heartbeat stops for longer than LOOP-DIS:stale:setpoint, someone else wrote the TDK current set point, the TDK did not accept a set, the service stops or hangs (LOOP-DIS:watchdog:setpoint), and at every start of the IOC or the service. Refuses PID for the same reasons, and while the TDK set point is outside the output limits."
      - "At the owner's working point the REK is at 24 A, its full scale: there the loop can only act downward. Owner, 2026-11-22 (question 3): \"set point below 24 A for now. 22 oughta do it.\" The loop runs at 22 A (default set point), below the full scale of the REK150-24, until the REK150-55 is there. The set point maximum (LOOP-DIS:spmax:setpoint) is 23 A by default, our free choice, to be confirmed."
    questions:
      - "Set point maximum 23 A (our choice, leaves 22 A a little room): right? Which output limits for the filament current (defaults 80 to 90 A, 90 A from the working point)?"

  - id: thermo_hv
    name: "Thermocouple readout"
    model: "Arduino based"
    subsystem: source
    location: hv
    host: ioc_hv
    link: "USB"
    protocol: "libcom1"
    epics:
      - {db: thermocouples.db, macros: {PORT: thermo, DEVICE: THM}}
      - {db: libcom1_device.db, macros: {PORT: thermo, DEVICE: THM}}
    status: modify
    libcom1: true
    labels: {t1: "Back Plate", t2: "Filament Feedthrough", t3: "Iso Trafo 1", t4: "Iso Trafo 2"}
    notes:
      - "Channel names (owner, 2026-11-21): 1 back plate, 2 filament feedthrough, 3 isolation transformer 1, 4 isolation transformer 2."
      - "The board sends 16 channels. t1 to t4 (degC), the cold junctions j1 to j4 and the fault codes f1 to f4 have PVs, the junction fault codes a1 to a4 do not. A faulted thermocouple reads INVALID."
      - "Assumed (A9): 19200 baud as in the firmware; the repository's and the lab's st.cmd say 9600."

  # ------------------------------------------------------------------ high voltage
  - id: au_src
    name: "Ion source voltage"
    model: "Matsusada AU20P15 (+20 kV, 15 mA) with CO-HV"
    subsystem: hv
    location: rack
    host: ioc_rack
    via: usb_opt
    link: "optical fiber (USB-OPT chain)"
    protocol: "StreamDevice, matsusada_co_ctrl.proto"
    epics: {db: matsusada_au20p7.db, macros: {PORT: mat_opt, UNITNUM: "1", IFS: "15"}}
    status: modify
    change: "Second optical chain, slimmer polling, scaling fix into the repository"
    notes:
      - "Why the update rate drops with every supply: the CO protocol returns one value per request, each request addresses one supply, and all supplies of a chain share one 9600 baud port. One request plus reply is about 20 characters, so about 20 ms on the wire before any turnaround time."
      - "The lab's matsusada_au20p7.db of 2023 polls five values per supply every 0.1 s (set-point echo and monitor for voltage and current, plus status). That is 50 requests per second for a single supply, more than the chain can carry. With N supplies every value updates N times slower."
      - "Fix 1, built in the reworked matsusada_au20p7.db: only the two monitors (MN1, MN2) are polled fast. The set-point echoes (CH0?, CH1?) are read after each set and every few seconds, the status once a second. That is 2 fast requests per supply instead of 5. Each supply reads its two monitors as one cycle and waits its turn on the line, so all supplies of a chain update at the same rate (measured 9.1 Hz with two supplies at 5 ms turnaround, 6.1 Hz at 16 ms)."
      - "Fix 2, built: two chains on two asyn ports (mat_opt behind the USB-OPT, mat_co behind the CO-U32), polled in parallel. Put the supplies that need the fastest read-back on the short chain."
      - "Fix 3, built: the set records have PRIO = HIGH, so that a command overtakes the queued polls instead of waiting behind them."
      - "Check the USB latency timer of both adapters' COM ports (16 ms by default on FTDI-type ports, 1 ms is possible). The turnaround time of the real adapters is not known: the simulator assumes 5 ms (A6)."
      - "The split: source voltage and puller on the short USB-OPT chain, because their currents show beam loading and sparks first, lenses 1 and 2 on the CO-U32. Confirmed by the owner (2026-11-21)."
      - "The AU20P15 reads correctly today (front panel and control system agree), so its 15 mA scaling was fixed locally. matsusada_au20p7.db now takes the full scale as macros (VFS, IFS), and st.cmd sets IFS=15 for this unit. Assumed (A4): the same 16-bit set and 12-bit monitor scaling as the P7.5; the lab's local fix has not been seen."
      - "Unit 1 (owner, 2026-11-21; also the lab's st.cmd of 2023)."
      - "For all four AU supplies and the REK (owner, 2026-11-21): the current is a LIMIT, not a set point. current:limit (alias current:setpoint, the lab's name) is restored at the IOC start by autosave, first from EPICS/ioc/iocBoot/<ioc>/limits.defaults, then from the file saved at run time (limits.sav), which wins. A change from the GUI is saved within 5 s. The limit is sent at the first contact, on every write and with every switch-on, and again every 5 s while it is not applied. The defaults are the full scales, not limits for operation: the owner sets the real ones."
      - "For all AU supplies and the REK: switching on sends REN, the saved current limit, RST and SW1; switching off REN, RST and SW0. REN is sent only at the first contact and on switching (owner, 2026-11-21: as in the lab), so the front panel can take local control; status:read then shows OFF, LOCAL or ON, LOCAL (MINOR)."
      - "For all AU supplies and the REK: the output follows the permit interlock_open (macro PERMIT) and latches (owner, 2026-11-21). Losing the permit switches the output off and clears the request (SetToggleOutput goes to 0); nothing switches on by itself when the permit returns, and a request made while the permit is lost is cleared at once."
      - "For all AU supplies and the REK: until the first contact with a supply after the IOC start, the voltage set point is in simulation mode (a write is not sent) and takes over the supply's setting at the first contact; the output state is taken over too, and the permit acts 5 s (GRACE) after the first contact. A supply that cannot be reached at the start is taken over when it answers."
      - "The PV prefix AU-20P7-<n> is wrong for this unit (it is a P15) and for the negative ones. Another reason to name PVs by function: source, puller, lens 1 and 2."

  - id: au_puller
    name: "Puller"
    model: "Matsusada AU20N7.5 (-20 kV, 7.5 mA) with CO-HV"
    subsystem: hv
    location: rack
    host: ioc_rack
    via: usb_opt
    link: "optical fiber (USB-OPT chain)"
    protocol: "StreamDevice, matsusada_co_ctrl.proto"
    epics: {db: matsusada_au20p7.db, macros: {PORT: mat_opt, UNITNUM: "2"}}
    status: modify
    change: "Second optical chain, database into the repository"
    notes:
      - "Arrangement (owner, 2026-11-21): the source is followed by a conical high-voltage break and a CF 10 inch six-way cross at ground potential. The extraction system with the puller and lenses 1 to 3 sits in the upstream flange of the cross."
      - "Unit 2 and the PV names AU-20P7-2:* (owner, 2026-11-21; also the lab's st.cmd of 2023)."
      - "The PVs show positive numbers, as the lab's database does (decision D3, assumption A5). The macro POL=- would show the sign."

  - id: au_lens1
    name: "Lens 1"
    model: "Matsusada AU20P7.5 (+20 kV, 7.5 mA) with CO-HV"
    subsystem: hv
    location: rack
    host: ioc_rack
    via: co_u32
    link: "optical fiber"
    protocol: "StreamDevice, matsusada_co_ctrl.proto"
    epics: {db: matsusada_au20p7.db, macros: {PORT: mat_co, UNITNUM: "3"}}
    status: modify
    change: "Slimmer polling"
    notes:
      - "Unit 3 (owner, 2026-11-21; also the lab's st.cmd of 2023). The repository's older st.cmd called unit 2 'Einzel Lens'; in the 2023 file unit 2 is the puller."

  - id: au_lens2
    name: "Lens 2"
    model: "Matsusada AU20N7.5 (-20 kV, 7.5 mA) with CO-HV"
    subsystem: hv
    location: rack
    host: ioc_rack
    via: co_u32
    link: "optical fiber"
    protocol: "StreamDevice, matsusada_co_ctrl.proto"
    epics: {db: matsusada_au20p7.db, macros: {PORT: mat_co, UNITNUM: "4"}}
    status: modify
    change: "Slimmer polling, database into the repository"
    notes:
      - "Unit 4, so the PV names are AU-20P7-4:* (owner, 2026-11-21). Revision 0.8 had lens 2 as an assumed unit 5 and unit 4 as lens 3."
      - "The PVs show positive numbers, as the lab's database does (decision D3, assumption A5). The macro POL=- would show the sign."

  - id: au_lens3
    name: "Lens 3 (grounded)"
    model: "Electrode grounded mechanically; the fifth supply, a Matsusada AU20P7.5, is not on the chain"
    subsystem: hv
    location: rack
    host: ioc_rack
    link: "none"
    protocol: "none"
    status: keep
    notes:
      - "Owner, 2026-11-21: the lens 3 electrode is grounded mechanically, and the fifth AU supply is not on the optical chain. Hardware only, no EPICS records: nothing loads or polls it."

  - id: hv_alloff
    name: "All HV off"
    model: "One command to both optical chains (#AL SW0)"
    subsystem: hv
    location: rack
    host: ioc_rack
    link: "both optical chains"
    protocol: "StreamDevice, matsusada_co_ctrl.proto (multiple command #AL)"
