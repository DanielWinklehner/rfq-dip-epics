    epics:
      - {db: turbo.db, macros: {PORT: TURBO, DEVICE: TURBO}}
      - {db: libcom1_device.db, macros: {PORT: TURBO, DEVICE: TURBO}}
    status: new
    flags: {assumed: "The Opta firmware does not exist yet: turbo.db defines its channel map (P13)"}
    options:
      - {name: "A: Opta on the remote-control terminals", text: "Start and stop through the remote inputs, normal-operation and failure relays read back.", interface: "digital I/O", note: "Recommended. The same relays feed the interlock."}
      - {name: "B: RS-232 monitor output", text: "The converter sends its internal values by itself, about every 8 s. Read only.", interface: "RS-232, listen only", note: "Add to A for speed and current. Data format has to be captured from a unit."}
      - {name: "C: replace by Turbo.Drive TD20 classic", text: "Leybold's successor, sold as a replacement for the NT 20.", interface: "RS-232, RS-485 or Profibus", note: "Only if full serial control is wanted."}
    notes:
      - "Phase 1 (owner, 2026-11-21): one turbopump only, on the bottom flange of the six-way cross. Turbopump 2 comes later. Its records and its simulator exist already, and the plan flags it as not installed."
      - "One set of PVs per pump (TURBO1:*, TURBO2:*, devices turbo1 and turbo2), and the identity of the Opta (TURBO:*). The PVs proposed in revision 0.6 (start, at speed, failure, speed, current, age) exist now with these prefixes."
      - "The NT 20 has no serial command interface: its RS-232 port only reports."
      - "Checked in the operating instructions GA 05.208/8: THREE status relays, NORMAL (speed above 80 % of the target speed), ACCEL and FAILURE (changeover: open when the controller has no power, closes on a failure). Remote inputs START (high-active) and STOP (low-active, dominant); a failure is reset by STOP, so there is no reset PV. RS-232: data output only, 9600 baud, all main parameters about every 8 s, format 'on request'."
      - "One Opta for both pumps (decision D7), wired as the 'ON/OFF switch' of Fig. 6: 2 of its 4 relays and 6 of its 8 inputs. The two spare relays could switch HEATING if the pumps have flange heaters."
      - "Assumed (P13): the Opta firmware does not exist yet. The channel map in turbo.db (r1 r2 r3 r4 n1 a1 f1 n2 a2 f2) is its specification."
    questions:
      - "Is the RS-232 port fitted on your two NT 20 units? Which TURBOVAC pumps do they drive?"

