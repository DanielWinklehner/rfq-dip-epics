  - {id: hv, name: "Extraction and beam optics high voltage", phase: 1, page: "Extraction"}
  - {id: vacuum, name: "Vacuum and gas", phase: 1, page: "Vacuum and gas"}
  - {id: cooling, name: "Cooling and interlocks", phase: 1, page: "Cooling and interlocks"}
  - {id: diag, name: "Beam diagnostics", phase: 1, page: "Diagnostics"}
