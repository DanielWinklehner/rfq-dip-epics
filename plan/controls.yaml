      - "The owner believes the nAIM is calibrated for N2 (2026-11-21; not checked on the gauge). Then with hydrogen the true pressure is roughly twice the reading, because an ionisation gauge calibrated for nitrogen reads hydrogen at about 0.4 to 0.5 of the true pressure."
