# ---------------------------------------------------------------------- interlock concept
interlock:
  intro:
    - "This is a concept for discussion. The required safety level (ISO 13849 performance level or IEC 62061 SIL) comes from the risk assessment that IBA's safety group owns. That assessment decides which functions must sit in certified hardware."
    - "Proposal: two layers that do not depend on each other, and EPICS only watches."
  layers:
    - id: A
      name: "Layer A: personnel safety"
      tech: "Hard-wired safety relays (dual channel, force-guided contacts)"
      text: "Doors, emergency stop, grounding. Cuts mains to the HV supplies and the platform. No software, no network."
    - id: B
      name: "Layer B: machine protection"
      tech: "PLC with fail-safe wiring (energize to run)"
      text: "Cooling, vacuum, temperatures. Removes the permits. Latches, needs a manual reset, remembers the first fault."
    - id: C
      name: "EPICS (monitor only)"
      tech: "Reads every input and permit over Ethernet"
      text: "Shows state, first fault and bypass. Can request a reset. Never part of the trip path."
  inputs:
    - {name: "Emergency stop", layer: A, source: "push buttons", status: new}
    - {name: "HV cage doors closed", layer: A, source: "door switches", status: new}
    - {name: "Grounding / earthing device", layer: A, source: "position switch", status: tbd}
    - {name: "Cooling water flow per branch", layer: B, source: "flow switches or Opta flow readout", status: modify}
    - {name: "Source and magnet temperatures", layer: B, source: "thermocouples / thermal switches", status: tbd}
    - {name: "Vacuum below threshold", layer: B, source: "gauge setpoint relay (nAIM / gauge controller)", status: modify}
    - {name: "Turbopumps at speed", layer: B, source: "turbopump controller relay", status: new}
    - {name: "Foreline pressure / roughing pump running", layer: B, source: "APG gauge, pump contact", status: new}
    - {name: "Existing interlock inputs i1, i2", layer: B, source: "old interlock box", status: tbd}
  outputs:
    - {name: "HV mains contactor", layer: A, acts_on: "AU supplies, platform isolation transformer"}
    - {name: "HV permit", layer: B, acts_on: "AU supplies (external interlock input)"}
    - {name: "Plasma permit", layer: B, acts_on: "filament heating and discharge supplies"}
    - {name: "Gas permit", layer: B, acts_on: "MFC / gas solenoid valve"}
    - {name: "Gate valve close", layer: B, acts_on: "solenoid valves"}
  rules:
    - "Loss of a signal, a broken wire or loss of PLC power must trip. Never the other way round."
    - "Trips latch. Reset is a deliberate action and only works when all inputs are good."
    - "A bypass needs a key switch and is visible in EPICS and on the rack."
    - "The IOC, the GUI and the network can fail without changing the safety state."
    - "Supplies on the HV platform get their permit through an isolated path (fiber or the mains contactor), not through a copper signal."
    - "Communication timeout in the device firmware (libcom1 set_comm_timeout) is an extra, not an interlock."
  questions:
    - "What are the two inputs of the existing interlock box, and what do they switch? (The lab GUI of 2023 calls them HV door lower and upper; in software they form interlock_open, the output permit of the AU supplies and the REK.)"
    - "Full list of interlock signals for MIST-2 at IBA, and what each one must switch off."
    - "Does IBA require a certified safety controller or safety relays for the personnel functions, and who signs it off?"
    - "PLC for layer B: Arduino Opta (in hand, no SIL rating), or an industrial PLC that IBA already supports?"

# ---------------------------------------------------------------------- work packages
work_packages:
  - id: WP1
    name: "Filament discharge supply swap"
    phase: 1
    items:
      - "Install the REK150-55, decide the interface (LAN preferred if the unit has it)."
      - "Make full-scale voltage and current macros in rek.db and matsusada_au20p7.db."
      - "Check platform power: isolation transformer, mains, cooling."
  - id: WP2
    name: "Vacuum system into EPICS"
    phase: 1
    items:
      - "Turbopump controllers: protocol file and database per controller type."
      - "Roughing pumps: on/off and status through the PLC, or serial if available."
      - "Replace the homemade gauge controller by an off-the-shelf one."
      - "Turbopumps: two Leybold NT 20 on an Opta (start, stop, status relays), RS-232 monitor output in addition."
      - "Mass flow controller: works as it is. Commit its protocol file and database to the repository."
      - "Solenoid valves: Arduino now, Opta when the new units arrive."
      - "Units, alarm limits and descriptions for all pressure PVs."
  - id: WP3
    name: "New interlock system"
    phase: 1
    items:
      - "Signal list and cause-and-effect matrix (which input removes which permit)."
      - "Agree the safety level and the hardware with IBA's safety group."
      - "Build, test every input including wire-break, document the tests."
      - "Read-only EPICS interface and a GUI page with first-fault display."
  - id: WP4
    name: "Rack IOC on Linux and Matsusada communication"
    phase: 1
    items:
      - "Answered on 2026-11-22 from Matsusada's driver CD rev. 1.7.0 and the owner's notes: the CO-U32 holds an FTDI chip under the USB ID 1192:1000, serial number CO001144. Linux needs a udev rule and no new driver. The rule and a read-only probe are in EPICS/ioc/host."
      - "Open: test the rule and the probe with the adapter (EPICS/ioc/host/README.md), then the acceptance test of the driver brief."
      - "The Matsusada CO-E32 LAN adapter may come later. Its delivery time is too long for use before the winter break, so the CO-U32 has to work on Linux first."
      - "The new USB-OPT adapter raises the same USB question as the CO-U32. Matsusada's current driver package (rev. 2.12.36.20) names the same single ID, 1192:1000, so the rule of the CO-U32 probably covers it. Its ID is not confirmed and its serial number is not known (open point P34)."
      - "Split the AU supplies over the two optical chains (two asyn ports, polled in parallel)."
      - "Rework matsusada_au20p7.db: fast polling for the monitors only, set-point echo after a set, PRIO = HIGH on the set records, full-scale macros, one 'all off' PV."
      - "Stable device names (udev by serial number) instead of COM numbers."
      - "Move the IOC, then retire Windows on the rack PC."
  - id: WP5
    name: "Firmware and protocol update of the Arduino devices"
    phase: 1
    items:
      - "Flash libcom1 protocol 2 firmware (branch libcom1-robustness-fixes), device by device, firmware before database."
      - "Load libcom1_device.db for every device (identity, firmware date, channel list)."
      - "Decide the safe state per device and switch on the communication timeout."
  - id: WP6
    name: "Network and naming"
    phase: 1
    items:
      - "New Ethernet switch: fiber to the rack IOC and to the platform IOC, copper ports for Ethernet devices in the rack."
      - "Nothing on the HV platform connects to the switch by copper. Fiber is the only link that crosses."
      - "Optas from USB to Ethernet with fixed addresses."
      - "Decide the PV naming convention before new PVs are added. Keep old names as aliases."
  - id: WP7
    name: "GUI overhaul"
    phase: 1
    items:
      - "New layout: one overview page with the source as a synoptic, one page per subsystem, expert pages behind them."
      - "Generate the subsystem pages from controls.yaml, so that a new device gets its page without hand work."
      - "Show alarm severity everywhere (the databases now propagate INVALID)."
  - id: WP8
    name: "Snapshot report (printout)"
    phase: 1
    items:
      - "Small service that reads all report PVs and writes one PDF plus a machine-readable snapshot (JSON)."
      - "Trigger from a GUI button. Operator comment and time stamp on the first page."
      - "The JSON snapshot doubles as a saved set of settings that can be restored later."
  - id: WP9
    name: "Data logging with retention tiers"
    phase: 1
    items:
      - "Done (T17): a time-series database (TimescaleDB) with Grafana behind a Channel Access logger of our own (logger/mist2log), tested on the emulation (make -C logger test). Docs: docs/emulation/LOGGER.md."
      - "Done: every PV of this plan has a tier (section logging, rules per role, record type and class, overrides per PV; a PV without one is a warning of build.py). The logger's PV list and the Grafana dashboards are generated from the registry."
      - "Done: set commands, alarms, interlock and output changes, loop modes with their reason and the logger's own events in one event log, kept for ever."
      - "Open: the computer it runs on (question under software), backups, synchronised clocks on all computers (NTP, open point P33)."
  - id: WP10
    name: "Control loops"
    phase: 1
    items:
      - "Done: the first loop, discharge current through the filament heating current (LOOP-DIS, docs/emulation/LOOP.md): records in the HV platform IOC, PID in the Python service loops/mist2loop beside it (owner's decision, 2026-11-22), tested on the emulation with the plant model."
      - "Done, step 1: plain PID with output limits, slew limit, anti-windup, bumpless switching and automatic hand-back to manual; the IOC enforces limits, slew and MANUAL without the service."
      - "Open: install the service on the platform computer (loops/README.md), measure the step response on the machine and set the gains (LOOP.md). Answered 2026-11-22 (question 3): the loop runs at 22 A until the REK150-55 is there."
      - "Step 2: neural-network layer (gain scheduling or feed-forward), trained on the logged data, behind the same limits."
  - id: WP11
    name: "Dipole scan in EPICS"
    phase: 2
    items:
      - "Python soft IOC for the NI USB-6001 (magnet current), picoammeter via StreamDevice."
      - "Replace the LabVIEW scan by a Python scan tool that only talks to PVs."
  - id: WP12
    name: "Emittance scanners in EPICS"
    phase: 2
    items:
      - "Motors, picoammeter and deflection voltage as PVs."
      - "Same scan tool as the dipole scan."

software:
  intro:
    - "The GUI shows values and sends commands, nothing else. Logging, reports and control loops are separate services. They keep running when no GUI is open, and each of them talks to the IOCs through PVs only."
    - "controls.yaml is the common configuration: GUI pages, the archiver's PV list with its tiers, and the report layout are generated from it."
  components:
    - {id: iocs, name: "Device IOCs", text: "Rack IOC and HV platform IOC", status: modify}
    - {id: loops, name: "Loop service", text: "Python service beside the HV platform IOC (loops/mist2loop): the discharge current PID is built, NN later", status: new}
    - {id: gui, name: "GUI", text: "React Automation Studio, new layout", status: modify}
    - {id: archiver, name: "Data logger", text: "Channel Access logger (logger/mist2log) on TimescaleDB, Grafana: three retention tiers plus events", status: new}
    - {id: report, name: "Snapshot report", text: "One PDF with all pertinent values, plus JSON", status: new}
    - {id: clients, name: "Scan and analysis tools", text: "Dipole scan, emittance scan, automated tuning", status: later}
  gui:
    - "Layout decided on 2026-11-21 (gate G2): the synoptic is the console. Clicking an element opens that device in a window of its own, which stays until it is closed. The lab computer has three monitors of about 24 inch: the synoptic on one, device windows on the others."
    - "React Automation Studio is actively developed (release 8.1.0 of May 2026), so the overhaul can stay on it. A better layout does not need a different toolkit."
    - "Its Docker setup expects Linux with host networking. Run it on Linux (WSL2 for development), not on Docker Desktop for Windows."
    - "The GUI code in the repository (RAS/IsoDAR) dates from 2021 and is full of placeholder PVs. Bring the version that runs in the lab into the repository before the overhaul starts."
    - "The new GUI lives in RAS/mist2 (RAS V8.1.0, decision D6). It takes every device and PV name from one registry, RAS/mist2/ReactApp/src/registry/registry.json, which plan/registry.py generates from this file, the databases and the st.cmd files."
    - "Overview page: the source drawn as a synoptic with live values at the place where they are measured. Color follows alarm severity, not hand-set thresholds in the page."
    - "Subsystem pages are generated from controls.yaml. Expert pages (raw channels, firmware identity, communication state) sit one click behind."
    - "Alternative, if you ever want the EPICS community standard with alarm server, archive viewer and save/restore in one tool: Phoebus (CS-Studio). It is a desktop application, not a web page."
  report:
    - "A small Python service reads every PV tagged for the report and writes one PDF: grouped by subsystem, with time stamp, alarm state and an operator comment."
    - "It stores the same snapshot as JSON next to the PDF. That file can be compared with a later one, or written back to restore the set points."
    - "It is triggered by a PV, so the button can sit in the GUI and a script can request a report as well."
  # id, interval (s; null: on change) and keep_days (null: for ever) are read by plan/registry.py
  # and the logger (docs/emulation/LOGGER.md); the other keys are the table of the Word document.
  tiers:
    - {id: raw, interval: null, keep_days: 30, tier: "1  raw", rate: "as sampled (up to 10 Hz)", keep: "30 days", use: "Fault finding, loop tuning, training data"}
    - {id: seconds, interval: 1, keep_days: 730, tier: "2  seconds", rate: "1 s mean, min, max", keep: "2 years", use: "Run comparison, conditioning history"}
    - {id: minutes, interval: 60, keep_days: null, tier: "3  minutes", rate: "1 min mean, min, max", keep: "forever", use: "Long-term trends, operating hours"}
    - {id: events, interval: null, keep_days: null, tier: "events", rate: "on change", keep: "forever", use: "Set commands, alarms, interlock trips, reports"}
  archiver:
    - "Built (T17): option 2, decided by the owner: a Channel Access logger of our own (logger/mist2log, Python with pyepics and psycopg) in front of TimescaleDB 2.17 on PostgreSQL 16, with Grafana 11 to look at the data. Its own Compose project in logger/ (make -C logger up). Design and operation: docs/emulation/LOGGER.md."
    - "Option 1, not taken: EPICS Archiver Appliance. Built for PVs (keeps IOC time stamps, alarm state and units), has short, medium and long-term stores, and is the community standard. More to install (Java services)."
    - "The logger subscribes with monitors (never polls) to every PV whose tier is not none (section logging), takes the IOC's time stamp, value, severity and status, and records disconnects and returns, so that a reader never holds a value across a gap. Means, minima and maxima per second and per minute are computed by the logger, weighted by time: a value that holds reads as that value in every interval, an interval without a valid value as a gap."
    - "Set commands (every change of a written PV, old and new value), every change of alarm severity, every change of an events PV (interlock permit, output states, loop mode with its reason) and the logger's own events go into one event log, kept for ever. Channel Access does not say who wrote a value: the log does not either."
    - "Life times are enforced by the database (TimescaleDB retention policies). While the database is lost the logger keeps a bounded buffer; what does not fit is counted and logged."
    - "The numbers in the table are a starting point. Decide them per PV group (section logging), disk space is not the limit for a system of this size."
  loops:
    - "Owner's decision, 2026-11-22: the PID runs in a Python service with pyepics (loops/mist2loop) on the HV platform computer, beside iocHV; the loops' own records (mode, set point, gains, limits, state) are plain records in iocHV (EPICS/Db/loop.db), without C code. The loop acts on a time scale of about a second, so Python's timing is good enough, the group reads Python, and the later steps are Python anyway. Design and operation: docs/emulation/LOOP.md."
    - "Two layers. The records are the interface and the backstop: without any help from the service they write the actuator only in PID, only within the output limits and the slew limit, and take the mode back with an alarm when the service's counter stands still. The service is the algorithm and the judgement: PID, anti-windup, bumpless switching, the decision to hand back or refuse."
    - "Owner, 2026-11-22 (question 3): \"set point below 24 A for now. 22 oughta do it.\" The discharge loop runs at 22 A, below the 24 A full scale of the REK150-24, until the REK150-55 is there."
    - "Built (step 1): the discharge current loop LOOP-DIS. Measured value: the discharge supply current (REK-1:current:read), actuator: the filament heating current (TDK:current:setpoint), both polled at 10 Hz. Service and writer run every 0.2 s, a seventh of the model's time constant of about 1.4 s."
    - "Plain PID in parallel form, derivative on the filtered measurement, output limits, slew limit, anti-windup by conditional integration, bumpless switching between MANUAL and PID and bumpless gain changes. A second loop is one more dbLoadRecords line of loop.db and one more prefix in the service's configuration."
    - "The loop hands back to MANUAL by itself when a permit condition fails (interlock, REK on in remote, TDK on), when a PV it uses is INVALID or not connected, when the IOC's heartbeat stops (stale data), when someone else writes the actuator, when the actuator does not accept a set, and (the IOC alone) when the service stops or hangs. The request returns to MANUAL (latched) and the reason is shown. A request for PID is refused for the same reasons."
    - "PVs per loop: mode request and mode, reason, the three permit conditions, service alive, limit flag, set point, measured value, output, error, the three terms; settings: set point minimum and maximum, Kp, Ki, Kd, derivative filter time, output minimum and maximum, slew, stale time, watchdog time, saved by autosave."
    - "Step 2, not built: the neural network as an advisor. It would be one more part of the service: gain scheduling (writing the Kp, Ki, Kd settings) or a feed-forward term added to the PID output before the limits, trained on tier 1 data. Its output passes the same limits as the PID output (and the IOC's backstop), and a bad or late answer means plain PID. No records exist for it yet."
  questions:
    - "Which values belong on the printout, and is one page per subsystem the right grouping?"
    - "Which values should be stabilized besides the discharge current, and what is the actuator for each?"
    - "Where should the data logger and the report service run: lab computer, rack IOC, or a new small server? What the logger needs (CPU, memory, disk per tier and year): docs/emulation/LOGGER.md, sizing."
    - "The tier of each PV group (section logging, table in docs/emulation/LOGGER.md) is our proposal: right?"

naming:
  text:
    - "Today's PV names (the lab's, decision D1) follow three different patterns: by device type (VALVE:s1:set, PRESSURE:apg:getpressure), by model (AU-20P7-1:voltage:setpoint, REK-1:..., TDK:...) and without any prefix (interlock_open). None says what the device does."
    - "A rebuild is the cheapest moment to fix this. Proposal: MIST2:<area>:<function>:<signal>, for example MIST2:SRC:FilDis:Current-SP, and keep the old names as EPICS aliases until the GUI and all scripts have moved."
    - "Renaming also touches every client that reads PVs by name, including automated tuning. Decide once, before the new devices get their PVs."

global_questions:
  - "Please send dbl output and st.cmd from both IOCs, so that the PV lists show what really runs and not only what is in the repository."
  - "Is the PV naming convention open for change, or are the current names fixed by existing clients?"
  - "Target date for phase 1, and what must work on day one?"

# ---------------------------------------------------------------------- trends
# The read-back roles that are drawn as trends: on the subsystem pages, in the device windows and
# on the Trends page of the GUI, and in the logger's Grafana dashboards (one graph per role and
# unit). beside: a set point that is drawn in the graph of the read-back it is for, where a device
# has both. plan/registry.py writes this section into the registry (key "trends").
trends:
  roles: [vread, iread, value, p, speed, current, flow, pv, out]
  beside: {pv: sp_cmd}

# ---------------------------------------------------------------------- logging: tier of every PV
# The tier of every existing PV (docs/emulation/LOGGER.md): raw, seconds or minutes (the finest
# tier it is kept in: a raw PV is also in seconds and minutes, a seconds PV also in minutes),
# events (stored on change only, kept for ever), or none. The first rule that applies wins:
#   pvs       one PV by its name
#   classes   every PV of a device of this widget class
#   internal  every record marked internal under databases
#   roles     by role (channel roles too)
#   written   every PV a client writes (ao, bo, longout, mbbo, stringout)
#   types     by record type
# Each rule is {tier, reason}. A PV that no rule covers is a WARNING of build.py; plan/registry.py
# writes the tier of each PV into the registry (key "log"), where the logger reads it.
logging:
  pvs:
    "PRESSURE:diag_box:getpressure": {tier: minutes, reason: "measures nothing in phase 1: its gauge goes to the second six-way cross in phase 2"}
  classes:
    logger: {tier: none, reason: "the logger's own state (R8); its loss is seen in the rack IOC, not in its own database"}
  internal: {tier: none, reason: "helper records (fan-outs, arrays, sequences, mirrors); what they do shows in the public PVs"}
  roles:
    heartbeat: {tier: none, reason: "counts every second; an IOC that stops shows as the disconnect of all its PVs, which is logged"}
    age: {tier: none, reason: "seconds since the last RS-232 record, counts every second; a stale record turns speed and current INVALID, which is logged"}
    power: {tier: seconds, reason: "computed from voltage and current, both kept raw"}
    junction: {tier: minutes, reason: "cold-junction temperature of the readout board: long-term only"}
    raw: {tier: raw, reason: "the last RS-232 record as text, every 8 s: kept to find the record format (P14)"}
    vget: {tier: events, reason: "echo of a setting: changes after a set"}
    ilimit_get: {tier: events, reason: "echo of a setting: changes after a set"}
    sp: {tier: events, reason: "echo of a setting: changes after a set"}
    state: {tier: events, reason: "a state (valves, doors, pump): changes rarely, every change is an event"}
    open: {tier: events, reason: "the interlock permit: every change is an event"}
    service: {tier: events, reason: "the loop service alive or not: every change is an event"}
  written: {tier: events, reason: "set points and requests: every change is a set command in the event log"}
  types:
    ai: {tier: raw, reason: "a measured value"}
    bi: {tier: events, reason: "a binary state: on change"}
    mbbi: {tier: events, reason: "a state word: on change"}
    longin: {tier: events, reason: "a status or fault word: on change"}
    stringin: {tier: events, reason: "identity or mode text: on change"}
    lsi: {tier: events, reason: "identity text: on change"}

# ---------------------------------------------------------------------- databases: roles of the records
# What the GUI and the tests need to know about the records of each database, written once and used
# for every device that loads it. plan/registry.py turns this into the registry.
#
#   class     widget class of the devices that load it (docs/emulation/gui/LAYOUT.md 1.4)
#   roles     role: record. The record is named without its prefix macro (voltage:setpoint, not
#             $(DEV)-$(UNITNUM):voltage:setpoint). A written record gets a mapping:
#               record    the record
#               readback  the role that shows the set took effect (null: none)
#               test      [low, high]: values a test may write
#               ack       true: the device answers the set, a missing answer is an alarm on the set
#                         record. false: it does not, a read of the setting follows instead.
#               note      optional
#   channels  roles per channel. <n> stands for the channel number: "s<n>" gives s1, s2, ...
#   internal  records that are no role: fan-outs, arrays, helper records
#   unit      macro that holds the unit address on a bus (a simulator with several units)
#   invalid_on  record: the faults of its device ([silent, closed], [closed] or []) on which it turns
#             INVALID, for the records whose database does not tell: a record that writes to a
#             device record through an output link, or that is disabled with a severity (SDIS,
#             DISS). build.py names every such record that lacks it. Everything else follows from
#             how the records are processed (build.py, "faults").
#   macros    macros that every load of this database has (optional)
#
# A record that is neither a role nor internal stops build.py and registry.py: add it here.
databases:
  ioc_info.db:
    class: ioc
    roles: {heartbeat: heartbeat, mode: mode}

  libcom1_device.db:
    roles:
      id: id
      firmware: firmware
      channel_list: {record: channels, note: "full text in the field VAL$ (more than 40 characters)"}

  matsusada_au20p7.db:
    class: supply
    unit: UNITNUM
    roles:
      vset: {record: "voltage:setpoint", readback: vget, test: [0, 100], ack: false,
             note: "until the first contact with the supply after an IOC start a write is not sent (simulation mode); then the set point takes over the supply's setting"}
      vget: "voltage:get"
      vread: "voltage:read"
      ilimit: {record: "current:limit", readback: ilimit_get, test: [1, 7.5], ack: false,
               note: "the current LIMIT (alias current:setpoint, the lab's name). Restored at the start by autosave and sent at the first contact, on every write, with every switch-on, and every 5 s while not applied. A write is also saved (limits.sav, within 5 s): a test reads the value first and writes it back. Test range in mA, within the full scale of every AU (7.5 or 15 mA)"}
      ilimit_get: "current:get"
      iread: "current:read"
      power: "power:read"
      out_cmd: {record: SetToggleOutput, readback: out_state, test: [0, 1], ack: false,
                note: "latches: losing the permit switches the output off and sets this to 0, a 1 written while the permit is lost is cleared at once, nothing switches on by itself. The permit acts 5 s after the first contact. On: REN, limit, RST, SW1; off: REN, RST, SW0"}
      out_state: read_output_status
      status: {record: "status:read", note: "OFF, ON (remote), OFF, LOCAL and ON, LOCAL (MINOR: front panel in control)"}
    internal: [OutputIntlk, ToggleOutput, "output:init", "_poll:tick", "_poll:gate", "_poll:start", "_poll:done",
               "_init:probe", "_init:vtake", "_init:vcopy", "_limit:apply", "_limit:send", "_permit:latch", "_permit:read",
               "_out:switch", "_out:limit", "_out:remote"]
    invalid_on:                # the running state, after the first contact
      "_init:probe": []        # disabled by output:init at the first contact (before it: INVALID on a closed port)
      "output:init": []        # runs only on a valid answer of the probe
      "_init:vcopy": []        # runs only after a valid voltage echo
      OutputIntlk: []          # its own device does not matter, only the permit (through MS)
      "_out:switch": []        # writes only when OutputIntlk changes; then LINK on a closed port

  rek.db:
    class: supply
    unit: UNITNUM
    roles:
      vset: {record: "voltage:setpoint", readback: vget, test: [0, 10], ack: false,
             note: "until the first contact with the supply after an IOC start a write is not sent (simulation mode); then the set point takes over the supply's setting"}
      vget: "voltage:get"
      vread: "voltage:read"
      ilimit: {record: "current:limit", readback: ilimit_get, test: [1, 24], ack: false,
               note: "the current LIMIT (alias current:setpoint, the lab's name). Restored at the start by autosave and sent at the first contact, on every write, with every switch-on, and every 5 s while not applied. A write is also saved (limits.sav, within 5 s): a test reads the value first and writes it back. Test range in A, within the full scale (24 A)"}
      ilimit_get: "current:get"
      iread: "current:read"
      power: "power:read"
      out_cmd: {record: SetToggleOutput, readback: out_state, test: [0, 1], ack: false,
                note: "latches: losing the permit switches the output off and sets this to 0, a 1 written while the permit is lost is cleared at once, nothing switches on by itself. The permit acts 5 s after the first contact. On: REN, limit, RST, SW1; off: REN, RST, SW0"}
      out_state: read_output_status
      status: {record: "status:read", note: "OFF, ON (remote), OFF, LOCAL and ON, LOCAL (MINOR: front panel in control)"}
    internal: [OutputIntlk, ToggleOutput, "output:init", "_poll:tick", "_poll:gate", "_poll:start", "_poll:done",
               "_init:probe", "_init:vtake", "_init:vcopy", "_limit:apply", "_limit:send", "_permit:latch", "_permit:read",
               "_out:switch", "_out:limit", "_out:remote"]
    invalid_on:                # the running state, after the first contact
      "_init:probe": []        # disabled by output:init at the first contact (before it: INVALID on a closed port)
      "output:init": []        # runs only on a valid answer of the probe
      "_init:vcopy": []        # runs only after a valid voltage echo
      OutputIntlk: []          # its own device does not matter, only the permit (through MS)
      "_out:switch": []        # writes only when OutputIntlk changes; then LINK on a closed port

  au_alloff.db:
    class: command
    roles:
      cmd: {record: "AU:alloff:set", readback: null, test: [0, 1], ack: false,
            note: "1 switches every AU output off and clears the requests; returns to 0 by itself"}
    internal: ["AU:alloff:fanout", "AU:alloff:chain1", "AU:alloff:chain2", "AU:alloff:requests", "AU:alloff:spare"]

  tdk.db:
    class: supply
    roles:
      vset: {record: "voltage:setpoint", readback: vread, test: [0, 2], ack: true,
             note: "no echo record: voltage:read follows while the output is on"}
      vread: "voltage:read"
      iset: {record: "current:setpoint", readback: iread, test: [0, 100], ack: true,
             note: "no echo record: current:read follows while the output is on"}
      iread: "current:read"
      power: "power:get"
      out_cmd: {record: "status:setpoint", readback: out_state, test: [0, 1], ack: true}
      out_state: "status:get"
      mode: "mode:get"
      fault: "fault:get"

  thermocouples.db:
    class: reading
    channels:
      "t<n>": {value: "t<n>:get", junction: "j<n>:get", fault: "f<n>:get"}
    internal: [data, "int:fanout"]

  sensorbox.db:
    class: reading
    channels:
      "t<n>": {value: "t<n>:gettemp"}
      "f<n>": {value: "f<n>:getflow"}
    internal: [data, "int:fanout"]

  faradaycup.db:
    class: reading
    roles: {value: "current:get"}
    internal: [data]

  pressure.db:
    class: gauge
    channels:
      apg: {p: "apg:getpressure"}
      diag_box: {p: "diag_box:getpressure"}
    internal: [data, "int:fanout"]

  aim.db:
    class: gauge
    roles:
      p: getpressure
      enable: {record: enable, readback: null, test: [0, 1], ack: true,
               note: "no read-back record: getpressure is INVALID while the gauge is off. After an IOC start it takes over the state of the cold cathode at the gauge's first answer (first_contact.db)"}
    internal: ["_enable:get"]

  solenoidbox.db:
    class: valve
    channels:
      "s<n>":
        cmd: {record: "s<n>:set", readback: state, test: [0, 1], ack: true,
              note: "after an IOC start it takes over the relay's state at the box's first answer (first_contact.db)"}
        state: "s<n>:get"
    internal: [data, "int:fanout"]

  interlockbox.db:
    class: interlock
    roles: {open: interlock_open}
    channels:
      "i<n>": {state: "i<n>:get_interlock"}
    internal: [data, "int:fanout"]

  mfc.db:
    class: mfc
    unit: ADDR
    roles:
      sp_cmd: {record: setSP, readback: sp, test: [0, 50], ack: true}
      sp: getSP
      flow: getFlow
      wink_cmd: {record: setWink, readback: wink, test: [0, 1], ack: true}
      wink: getWink

  turbo.db:
    internal: [data]

  turbo_pump.db:
    class: turbo
    roles:
      run_cmd: {record: "start:set", readback: run_state, test: [0, 1], ack: true,
                note: "0 stops the pump and resets a failure. After an IOC start it takes over the run relay's state at the Opta's first answer (first_contact.db)"}
      run_state: "start:get"
      atspeed: "atspeed:get"
      accel: "accel:get"
      failure: "failure:get"
      state: "state:get"
    internal: ["int:relays", "int:state"]

  first_contact.db:            # loaded once per request record, beside the device's database
    internal: ["_take:$(N)", "_take:$(N):copy"]
    invalid_on:
      "_take:$(N):copy": []    # runs once, at the first contact, and then in simulation mode

  loop.db:
    class: loop
    roles:
      mode_cmd: {record: "mode:setpoint", readback: null, test: [0, 0], ack: true,
                 note: "the operator's request, accepted by the IOC itself (mode:get shows the mode, which needs more than the request); cleared (MANUAL) by the service when it hands back or refuses and by the IOC when the service is not alive (latch). A test writes only MANUAL: PID would act on the filament heating"}
      mode: {record: "mode:get", note: "PID only while requested, accepted by the service and the service alive"}
      reason: {record: "reason:get", note: "why the loop last handed back or refused, until the next request"}
      service: {record: "service:get", note: "1 while the loop service's counter changes within the watchdog time, else 0 (MAJOR)"}
      permit1: {record: "permit1:get", note: "permit condition 1 as words: fulfilled, the condition's words (not fulfilled, no alarm), no data (INVALID: its PV INVALID or not connected)"}
      permit2: {record: "permit2:get", note: "permit condition 2, as permit 1"}
      permit3: {record: "permit3:get", note: "permit condition 3, as permit 1"}
      limit: {record: "limit:get", note: "free, at minimum, at maximum (MINOR) or slew limited"}
      pv: {record: "value:read", note: "the measured value as the loop reads it"}
      out: {record: "output:get", note: "in PID the service's output, in MANUAL the actuator's set point"}
      error: "error:get"
      pterm: "p:get"
      iterm: "i:get"
      dterm: "d:get"
      sp_cmd: {record: "value:setpoint", readback: null, test: [10, 20], ack: true,
               note: "soft setting of the IOC (no device: accepted by the IOC itself), saved by autosave; clamped to [spmin, spmax]"}
      spmin: {record: "spmin:setpoint", readback: null, test: [0, 5], ack: true,
              note: "set point minimum, saved by autosave; moved above the set point, it brings the set point up to it"}
      spmax: {record: "spmax:setpoint", readback: null, test: [22.5, 24], ack: true,
              note: "set point maximum, saved by autosave (default 23 A, our choice, to be confirmed); moved below the set point, it brings the set point down to it"}
      kp: {record: "kp:setpoint", readback: null, test: [0.1, 1], ack: true, note: "soft setting, saved by autosave"}
      ki: {record: "ki:setpoint", readback: null, test: [0.05, 1], ack: true, note: "soft setting, saved by autosave"}
      kd: {record: "kd:setpoint", readback: null, test: [0, 0.5], ack: true, note: "soft setting, saved by autosave"}
      dfilter: {record: "dfilter:setpoint", readback: null, test: [0.1, 1], ack: true, note: "soft setting, saved by autosave"}
      outmin: {record: "outmin:setpoint", readback: null, test: [70, 80], ack: true, note: "soft setting, saved by autosave"}
      outmax: {record: "outmax:setpoint", readback: null, test: [90, 95], ack: true, note: "soft setting, saved by autosave"}
      slew: {record: "slew:setpoint", readback: null, test: [0.2, 2], ack: true, note: "soft setting, saved by autosave"}
      stale: {record: "stale:setpoint", readback: null, test: [2, 10], ack: true, note: "soft setting, saved by autosave"}
      watchdog: {record: "watchdog:setpoint", readback: null, test: [1, 5], ack: true, note: "soft setting, saved by autosave"}
    internal: [_mode, _active, _count, _dead, _drop, _c1, _s1, _c2, _s2, _c3, _s3, _act, _hb, _out, _target, _write]
    invalid_on:
      _write: []               # writes the actuator only in PID; the suite's fault tests run in MANUAL

  logger_status.db:
    class: logger
    roles:
      count: {record: "count:get", note: "+1 per second, written by the logger"}
      alive: {record: "alive:get", note: "1 while the counter changed within 5 s, else 0 (MAJOR): the logger is dead or cannot reach this IOC"}
      connected: "connected:get"
      disconnected: {record: "disconnected:get", note: "MINOR while any logged PV is not connected"}
      rows: "rows:get"
      db: {record: "db:get", note: "unknown (no logger since the IOC start), connected, lost (MAJOR)"}
      buffer: {record: "buffer:get", note: "share of the buffer in use while the database is lost or slow: MINOR from 50 %, MAJOR from 90 %"}
      dropped: {record: "dropped:get", note: "rows that did not fit into the buffer since the logger started (MINOR from the first; each loss is an event)"}

  nt20_monitor.db:
    class: turbo
    roles:
      speed: "speed:get"
      current: "current:get"
      age: "age:get"
      raw: {record: "raw:get", note: "full text in the field VAL$"}
    internal: ["int:raw", "int:speed", "int:current", "int:fresh", "int:stale", "int:refresh",
               "int:speedok", "int:curok", "int:speedoff", "int:curoff"]
    invalid_on:                # disabled with DISS INVALID once no record came for AGE_LIMIT seconds;
                               # speed and current also when a record came that did not parse
      "speed:get": [silent, closed]
      "current:get": [silent, closed]
      "raw:get": [silent, closed]
