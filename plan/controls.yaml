# ---------------------------------------------------------------------- interlock concept
interlock:
  intro:
    - "This is a concept for discussion. The required safety level (ISO 13849 performance level or IEC 62061 SIL) comes from the risk assessment that IBA's safety group owns. That assessment decides which functions must sit in certified hardware."
    - "Proposal: two layers that do not depend on each other, and EPICS only watches."
  layers:
    - id: A
      name: "Layer A: personnel safety"
      tech: "Hard-wired safety relays (dual channel, force-guided contacts)"
      text: "Doors, emergency stop, grounding. Cuts mains to the HV supplies and the platform. No software, no network."
    - id: B
      name: "Layer B: machine protection"
      tech: "PLC with fail-safe wiring (energize to run)"
      text: "Cooling, vacuum, temperatures. Removes the permits. Latches, needs a manual reset, remembers the first fault."
    - id: C
      name: "EPICS (monitor only)"
      tech: "Reads every input and permit over Ethernet"
      text: "Shows state, first fault and bypass. Can request a reset. Never part of the trip path."
  inputs:
    - {name: "Emergency stop", layer: A, source: "push buttons", status: new}
    - {name: "HV cage doors closed", layer: A, source: "door switches", status: new}
    - {name: "Grounding / earthing device", layer: A, source: "position switch", status: tbd}
    - {name: "Cooling water flow per branch", layer: B, source: "flow switches or Opta flow readout", status: modify}
    - {name: "Source and magnet temperatures", layer: B, source: "thermocouples / thermal switches", status: tbd}
    - {name: "Vacuum below threshold", layer: B, source: "gauge setpoint relay (nAIM / gauge controller)", status: modify}
    - {name: "Turbopumps at speed", layer: B, source: "turbopump controller relay", status: new}
    - {name: "Foreline pressure / roughing pump running", layer: B, source: "APG gauge, pump contact", status: new}
    - {name: "Existing interlock inputs i1, i2", layer: B, source: "old interlock box", status: tbd}
  outputs:
    - {name: "HV mains contactor", layer: A, acts_on: "AU supplies, platform isolation transformer"}
    - {name: "HV permit", layer: B, acts_on: "AU supplies (external interlock input)"}
    - {name: "Plasma permit", layer: B, acts_on: "filament heating and discharge supplies"}
    - {name: "Gas permit", layer: B, acts_on: "MFC / gas solenoid valve"}
    - {name: "Gate valve close", layer: B, acts_on: "solenoid valves"}
  rules:
    - "Loss of a signal, a broken wire or loss of PLC power must trip. Never the other way round."
    - "Trips latch. Reset is a deliberate action and only works when all inputs are good."
    - "A bypass needs a key switch and is visible in EPICS and on the rack."
    - "The IOC, the GUI and the network can fail without changing the safety state."
    - "Supplies on the HV platform get their permit through an isolated path (fiber or the mains contactor), not through a copper signal."
    - "Communication timeout in the device firmware (libcom1 set_comm_timeout) is an extra, not an interlock."
  questions:
    - "What are the two inputs of the existing interlock box, and what do they switch?"
    - "Full list of interlock signals for MIST-2 at IBA, and what each one must switch off."
    - "Does IBA require a certified safety controller or safety relays for the personnel functions, and who signs it off?"
    - "PLC for layer B: Arduino Opta (in hand, no SIL rating), or an industrial PLC that IBA already supports?"

# ---------------------------------------------------------------------- work packages
work_packages:
  - id: WP1
    name: "Filament discharge supply swap"
    phase: 1
    items:
      - "Install the REK150-55, decide the interface (LAN preferred if the unit has it)."
      - "Make full-scale voltage and current macros in rek.db and matsusada_au20p7.db."
      - "Check platform power: isolation transformer, mains, cooling."
  - id: WP2
    name: "Vacuum system into EPICS"
    phase: 1
    items:
      - "Turbopump controllers: protocol file and database per controller type."
      - "Roughing pumps: on/off and status through the PLC, or serial if available."
      - "Replace the homemade gauge controller by an off-the-shelf one."
      - "Turbopumps: two Leybold NT 20 on an Opta (start, stop, status relays), RS-232 monitor output in addition."
      - "Mass flow controller: works as it is. Commit its protocol file and database to the repository."
      - "Solenoid valves: Arduino now, Opta when the new units arrive."
      - "Units, alarm limits and descriptions for all pressure PVs."
  - id: WP3
    name: "New interlock system"
    phase: 1
    items:
      - "Signal list and cause-and-effect matrix (which input removes which permit)."
      - "Agree the safety level and the hardware with IBA's safety group."
      - "Build, test every input including wire-break, document the tests."
      - "Read-only EPICS interface and a GUI page with first-fault display."
  - id: WP4
    name: "Rack IOC on Linux and Matsusada communication"
    phase: 1
    items:
      - "Find out which USB chip the CO-U32 uses (vendor and product ID). If it is a standard USB-serial chip with a custom ID, Linux needs a udev rule and no new driver."
      - "Otherwise: user-space bridge (libusb) that exposes a serial or TCP port to asyn."
      - "The Matsusada CO-E32 LAN adapter may come later. Its delivery time is too long for use before the winter break, so the CO-U32 has to work on Linux first."
      - "The new USB-OPT adapter raises the same USB question as the CO-U32. Answer both together."
      - "Split the AU supplies over the two optical chains (two asyn ports, polled in parallel)."
      - "Rework matsusada_au20p7.db: fast polling for the monitors only, set-point echo after a set, PRIO = HIGH on the set records, full-scale macros, one 'all off' PV."
      - "Stable device names (udev by serial number) instead of COM numbers."
      - "Move the IOC, then retire Windows on the rack PC."
  - id: WP5
    name: "Firmware and protocol update of the Arduino devices"
    phase: 1
    items:
      - "Flash libcom1 protocol 2 firmware (branch libcom1-robustness-fixes), device by device, firmware before database."
      - "Load libcom1_device.db for every device (identity, firmware date, channel list)."
      - "Decide the safe state per device and switch on the communication timeout."
  - id: WP6
    name: "Network and naming"
    phase: 1
    items:
      - "New Ethernet switch: fiber to the rack IOC and to the platform IOC, copper ports for Ethernet devices in the rack."
      - "Nothing on the HV platform connects to the switch by copper. Fiber is the only link that crosses."
      - "Optas from USB to Ethernet with fixed addresses."
      - "Decide the PV naming convention before new PVs are added. Keep old names as aliases."
  - id: WP7
    name: "GUI overhaul"
    phase: 1
    items:
      - "New layout: one overview page with the source as a synoptic, one page per subsystem, expert pages behind them."
      - "Generate the subsystem pages from controls.yaml, so that a new device gets its page without hand work."
      - "Show alarm severity everywhere (the databases now propagate INVALID)."
  - id: WP8
    name: "Snapshot report (printout)"
    phase: 1
    items:
      - "Small service that reads all report PVs and writes one PDF plus a machine-readable snapshot (JSON)."
      - "Trigger from a GUI button. Operator comment and time stamp on the first page."
      - "The JSON snapshot doubles as a saved set of settings that can be restored later."
  - id: WP9
    name: "Data logging with retention tiers"
    phase: 1
    items:
      - "Choose the archiver (EPICS Archiver Appliance, or a time-series database with Grafana)."
      - "Tag every PV in controls.yaml with its tier. Generate the archiver configuration from it."
      - "Log set commands, alarms and interlock trips as events, kept forever."
  - id: WP10
    name: "Control loops"
    phase: 1
    items:
      - "Loop IOC on the HV platform computer, first loop: discharge current."
      - "Step 1: plain PID with output limits, slew limit and automatic hand-back to manual."
      - "Step 2: neural-network layer (gain scheduling or feed-forward), trained on the logged data, behind the same limits."
  - id: WP11
    name: "Dipole scan in EPICS"
    phase: 2
    items:
      - "Python soft IOC for the NI USB-6001 (magnet current), picoammeter via StreamDevice."
      - "Replace the LabVIEW scan by a Python scan tool that only talks to PVs."
  - id: WP12
    name: "Emittance scanners in EPICS"
    phase: 2
    items:
      - "Motors, picoammeter and deflection voltage as PVs."
      - "Same scan tool as the dipole scan."

software:
  intro:
    - "The GUI shows values and sends commands, nothing else. Logging, reports and control loops are separate services. They keep running when no GUI is open, and each of them talks to the IOCs through PVs only."
    - "controls.yaml is the common configuration: GUI pages, the archiver's PV list with its tiers, and the report layout are generated from it."
  components:
    - {id: iocs, name: "Device IOCs", text: "Rack IOC and HV platform IOC", status: modify}
    - {id: loops, name: "Loop IOC", text: "PID and NN loops, runs next to the HV platform IOC", status: new}
    - {id: gui, name: "GUI", text: "React Automation Studio, new layout", status: modify}
    - {id: archiver, name: "Archiver", text: "Three retention tiers plus events", status: new}
    - {id: report, name: "Snapshot report", text: "One PDF with all pertinent values, plus JSON", status: new}
    - {id: clients, name: "Scan and analysis tools", text: "Dipole scan, emittance scan, automated tuning", status: later}
  gui:
    - "React Automation Studio is actively developed (release 8.1.0 of May 2026), so the overhaul can stay on it. A better layout does not need a different toolkit."
    - "Its Docker setup expects Linux with host networking. Run it on Linux (WSL2 for development), not on Docker Desktop for Windows."
    - "The GUI code in the repository (RAS/IsoDAR) dates from 2021 and is full of placeholder PVs. Bring the version that runs in the lab into the repository before the overhaul starts."
    - "Overview page: the source drawn as a synoptic with live values at the place where they are measured. Color follows alarm severity, not hand-set thresholds in the page."
    - "Subsystem pages are generated from controls.yaml. Expert pages (raw channels, firmware identity, communication state) sit one click behind."
    - "Alternative, if you ever want the EPICS community standard with alarm server, archive viewer and save/restore in one tool: Phoebus (CS-Studio). It is a desktop application, not a web page."
  report:
    - "A small Python service reads every PV tagged for the report and writes one PDF: grouped by subsystem, with time stamp, alarm state and an operator comment."
    - "It stores the same snapshot as JSON next to the PDF. That file can be compared with a later one, or written back to restore the set points."
    - "It is triggered by a PV, so the button can sit in the GUI and a script can request a report as well."
  tiers:
    - {tier: "1  raw", rate: "as sampled (up to 10 Hz)", keep: "30 days", use: "Fault finding, loop tuning, training data"}
    - {tier: "2  seconds", rate: "1 s mean, min, max", keep: "2 years", use: "Run comparison, conditioning history"}
    - {tier: "3  minutes", rate: "1 min mean, min, max", keep: "forever", use: "Long-term trends, operating hours"}
    - {tier: "events", rate: "on change", keep: "forever", use: "Set commands, alarms, interlock trips, reports"}
  archiver:
    - "Option 1: EPICS Archiver Appliance. Built for PVs (keeps IOC time stamps, alarm state and units), has short, medium and long-term stores, and is the community standard. More to install (Java services)."
    - "Option 2: a time-series database (TimescaleDB or InfluxDB) with Grafana. Lighter, retention and down-sampling rules are built in, and history is one query away from Python. Needs a small Channel Access logger in front."
    - "The numbers in the table are a starting point. Decide them per PV group, disk space is not the limit for a system of this size."
  loops:
    - "Loops run in a soft IOC on the HV platform computer, next to the supplies they act on. No GUI and no Ethernet hop inside the loop."
    - "First loop: discharge current. Measured value is the discharge supply current (REK), presumably the actuator is the filament heating current (TDK). Both are polled at 10 Hz today, so the loop can correct on a time scale of about a second, which matches a thermal filament."
    - "Step 1 is a plain PID. It needs output limits, a slew-rate limit, anti-windup and bumpless switching between manual and automatic before anything smarter is added."
    - "The loop hands back to manual by itself when an interlock trips, when a PV it uses goes INVALID, or when its data is stale."
    - "Step 2 adds the neural network as an advisor: it schedules the PID gains or supplies a feed-forward term, trained on tier 1 data. Its output passes the same limits as the PID output, and a bad or late answer means plain PID."
    - "Proposed PVs per loop: enable, mode (manual / PID / PID+NN), setpoint, output, kp, ki, kd, limits, state."
  questions:
    - "Which values belong on the printout, and is one page per subsystem the right grouping?"
    - "Which values should be stabilized besides the discharge current, and what is the actuator for each?"
    - "Where should archiver and report service run: lab computer, rack IOC, or a new small server?"

naming:
  text:
    - "Today's PV names follow three different patterns: by COM-port nickname (avr12:s1:set), by model (AU-20P7-1:voltage:set, REK-1:..., tdk:...) and without any prefix (interlock_status). None says what the device does."
    - "A rebuild is the cheapest moment to fix this. Proposal: MIST2:<area>:<function>:<signal>, for example MIST2:SRC:FilDis:Current-SP, and keep the old names as EPICS aliases until the GUI and all scripts have moved."
    - "Renaming also touches every client that reads PVs by name, including automated tuning. Decide once, before the new devices get their PVs."

global_questions:
  - "Please send dbl output and st.cmd from both IOCs, so that the PV lists show what really runs and not only what is in the repository."
  - "Is the PV naming convention open for change, or are the current names fixed by existing clients?"
  - "Target date for phase 1, and what must work on day one?"
