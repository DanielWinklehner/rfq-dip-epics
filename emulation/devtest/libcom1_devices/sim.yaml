# sim.yaml - the five libcom1 Arduino boards of MIST-2, one simulator each (type libcom1).
#
# Every entry follows its sketch in AVR/:
#   identity       device.set_identity("<name>", __DATE__) in setup()
#   firmware       __DATE__ of the build: unknown, "Nov 21 2026" is a placeholder
#   channels       the order of MakeChannelMap = the order of the "A" reply
#   access         r if the channel has a getter, w if it has a setter. A dummy setter
#                  (dummy_set, dummySetFunc) is a setter: the set is accepted and ignored
#   baud           Serial.begin(); all sketches use the default framing 8N1 (bits_per_char 10)
#   out_terminator Serial.println() ends lines with CR LF; input lines end with LF
#                  (LineBuffer, a CR before it is ignored)
#   number_format  avr: the AVR boards (Arduino Mega), values are written by dtostre();
#                  g: the interlock box, an Arduino Opta (snprintf %g)
#   out_buffer     the template parameter of IOHandler / SerialDevice in the sketch
#   in_buffer      LineBuffer<128> in every sketch
#   turnaround_ms  assumption: loop() returns quickly, the real reply latency is not measured
# The port number is the number of the lab's COM port (AVR6 = COM6 ...); the thermocouple
# board has 5020 as in emulation/sim/examples/thermocouple.yaml. Control port = port + 1000.
# Signal values and noise are a plausible picture, not measurements.

# AVR/devices/IonGaugeController/IonGaugeController.ino, asyn port AVR6, DEVICE=PRESSURE.
# The lab's st.cmd sets parity even and calls it "Ion gauge teensy"; the sketch is 8N1 on a
# Mega (see the report of T6). Gauge 1 Pirani 1e-3..944.06 torr, gauge 2 ion gauge
# 7.5e-9..7.5e-3 torr: the clamps of volt_to_torr_pirani() and volt_to_torr().
- name: gauges
  type: libcom1
  port: 5006
  baud: 115200
  bits_per_char: 10
  turnaround_ms: 1
  in_terminator: "\n"
  out_terminator: "\r\n"
  options:
    identity: IonGaugeController
    firmware: "Nov 21 2026"
    number_format: avr
    out_buffer: 128
    in_buffer: 128
    channels:
      - {id: p1, access: rw, behaviour: analog, value: 2.0e-2, noise: 1.0e-4, lo: 1.0e-3, hi: 944.06}
      - {id: p2, access: rw, behaviour: analog, value: 5.0e-6, noise: 2.0e-8, lo: 7.5e-9, hi: 7.5e-3}

# AVR/devices/SensorBox/SensorBox.ino, asyn port AVR10, DEVICE=SENSOR.
# t1..t7 MAX31856 (resolution 0.0078125 degC), f1..f5 flow counters: pulses in 0.5 s x 0.06,
# so a flow value is a multiple of 0.06. Every channel has dummySetFunc.
- name: sensorbox
  type: libcom1
  port: 5010
  baud: 115200
  bits_per_char: 10
  turnaround_ms: 1
  in_terminator: "\n"
  out_terminator: "\r\n"
  options:
    identity: SensorBox
    firmware: "Nov 21 2026"
    number_format: avr
    out_buffer: 192
    in_buffer: 128
    channels:
      - {id: t1, access: rw, behaviour: analog, value: 24.0, noise: 0.05, step: 0.0078125}
      - {id: t2, access: rw, behaviour: analog, value: 25.0, noise: 0.05, step: 0.0078125}
      - {id: t3, access: rw, behaviour: analog, value: 26.0, noise: 0.05, step: 0.0078125}
      - {id: t4, access: rw, behaviour: analog, value: 27.0, noise: 0.05, step: 0.0078125}
      - {id: t5, access: rw, behaviour: analog, value: 28.0, noise: 0.05, step: 0.0078125}
      - {id: t6, access: rw, behaviour: analog, value: 29.0, noise: 0.05, step: 0.0078125}
      - {id: t7, access: rw, behaviour: analog, value: 30.0, noise: 0.05, step: 0.0078125}
      - {id: f1, access: rw, behaviour: analog, value: 0.0, noise: 0.0, lo: 0, step: 0.06}
      - {id: f2, access: rw, behaviour: analog, value: 3.0, noise: 0.06, lo: 0, step: 0.06}
      - {id: f3, access: rw, behaviour: analog, value: 2.4, noise: 0.06, lo: 0, step: 0.06}
      - {id: f4, access: rw, behaviour: analog, value: 1.8, noise: 0.06, lo: 0, step: 0.06}
      - {id: f5, access: rw, behaviour: analog, value: 0.0, noise: 0.0, lo: 0, step: 0.06}

# AVR/devices/InterlockOpta/InterlockOpta.ino (an Arduino Opta in place of the lost Mega box
# AVR/devices/InterlockBox, same channels), asyn port AVR11, DEVICE=INTLK. Copy of the entry
# in emulation/sim/config/rack.yaml, which is compared line by line with the firmware.
# i1, i2: the doors as the Opta reports them, 1 = closed (after a hold time of 1 s, which is
# not modelled: the value set here is the reported one). A set is accepted and ignored.
# s1, s2: relays 3 and 4 of the Opta, on for exactly 1, read back 1 when on: behaviour relay.
- name: interlockbox
  type: libcom1
  port: 5011
  baud: 115200
  bits_per_char: 10
  turnaround_ms: 1
  in_terminator: "\n"
  out_terminator: "\r\n"
  options:
    identity: InterlockOpta
    firmware: "Nov 21 2026"
    number_format: g
    out_buffer: 128
    in_buffer: 128
    channels:
      - {id: i1, access: rw, behaviour: constant, value: 1}
      - {id: i2, access: rw, behaviour: constant, value: 1}
      - {id: s1, access: rw, behaviour: relay}
      - {id: s2, access: rw, behaviour: relay}

# AVR/devices/SolenoidValveBox/SolenoidValveBox/SolenoidValveBox.ino, asyn port AVR12,
# DEVICE=VALVE. Eight relays (IndexedChannel s1..s8): a channel reads 1 when its relay is
# energised; set_solenoid() energises for exactly 1 and releases for anything else.
- name: valvebox
  type: libcom1
  port: 5012
  baud: 115200
  bits_per_char: 10
  turnaround_ms: 1
  in_terminator: "\n"
  out_terminator: "\r\n"
  options:
    identity: SolenoidValveBox
    firmware: "Nov 21 2026"
    number_format: avr
    out_buffer: 160
    in_buffer: 128
    channels:
      - {id: s1, access: rw, behaviour: relay}
      - {id: s2, access: rw, behaviour: relay}
      - {id: s3, access: rw, behaviour: relay}
      - {id: s4, access: rw, behaviour: relay}
      - {id: s5, access: rw, behaviour: relay}
      - {id: s6, access: rw, behaviour: relay}
      - {id: s7, access: rw, behaviour: relay}
      - {id: s8, access: rw, behaviour: relay}

# AVR/Thermocouple/Thermocouple.ino, asyn port thermo (platform IOC), DEVICE=THM.
# Serial.begin(19200); the lab's st.cmd (commented out) has 9600. Four MAX31856 type K:
# t1..t4 thermocouple (0.0078125 degC), j1..j4 cold junction (0.015625 degC), f1..f4 and
# a1..a4 fault codes of check_fault(): 0 none, 1 no MAX31856, 2 voltage, 3 open. With a fault
# the temperature channel reads the error value instead (10000 open, 10001 voltage, 10002 no
# chip, MAX31856.h). Every channel has dummy_set().
- name: thermocouple
  type: libcom1
  port: 5020
  baud: 19200
  bits_per_char: 10
  turnaround_ms: 1
  in_terminator: "\n"
  out_terminator: "\r\n"
  options:
    identity: Thermocouple
    firmware: "Nov 21 2026"
    number_format: avr
    out_buffer: 512
    in_buffer: 128
    channels:
      - {id: t1, access: rw, behaviour: analog, value: 22.0, noise: 0.05, step: 0.0078125}
      - {id: t2, access: rw, behaviour: analog, value: 22.5, noise: 0.05, step: 0.0078125}
      - {id: t3, access: rw, behaviour: analog, value: 23.0, noise: 0.05, step: 0.0078125}
      - {id: t4, access: rw, behaviour: analog, value: 23.5, noise: 0.05, step: 0.0078125}
      - {id: j1, access: rw, behaviour: analog, value: 24.0, noise: 0.02, step: 0.015625}
      - {id: j2, access: rw, behaviour: analog, value: 24.0, noise: 0.02, step: 0.015625}
      - {id: j3, access: rw, behaviour: analog, value: 24.0, noise: 0.02, step: 0.015625}
      - {id: j4, access: rw, behaviour: analog, value: 24.0, noise: 0.02, step: 0.015625}
      - {id: f1, access: rw, behaviour: constant, value: 0}
      - {id: f2, access: rw, behaviour: constant, value: 0}
      - {id: f3, access: rw, behaviour: constant, value: 0}
      - {id: f4, access: rw, behaviour: constant, value: 0}
      - {id: a1, access: rw, behaviour: constant, value: 0}
      - {id: a2, access: rw, behaviour: constant, value: 0}
      - {id: a3, access: rw, behaviour: constant, value: 0}
      - {id: a4, access: rw, behaviour: constant, value: 0}
