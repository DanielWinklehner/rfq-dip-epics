# Device test harness: one simulator, one IOC, one pytest container on a network of their own.
# Started by run.sh only, which sets the project name and the variables below.
#   DEVTEST_REPO   the worktree run.sh belongs to      DEVTEST_CASE  the case directory
#   DEVTEST_SIM    the simulator command                MIST2_UID/GID the calling user
# No fixed subnet: Docker assigns one, so parallel runs do not collide.

x-tools: &tools
  image: mist2-tools:dev
  user: "${MIST2_UID:-1000}:${MIST2_GID:-1000}"
  working_dir: /case
  volumes:
    - ${DEVTEST_REPO:?}:/repo
    - ${DEVTEST_CASE:?}:/case
  environment: &tools-env
    HOME: /tmp
    PYTHONPATH: /repo/emulation/sim
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"

services:
  sim:
    <<: *tools
    init: true
    command: ["sh", "-c", "${DEVTEST_SIM:?}"]

  # The IOC runs in a loop, so that a test can restart it: a new content of the file
  # build/ioc-restart of the case (written by the test container) stops the IOC process and
  # starts it again in the same container (its /tmp is kept). An IOC that exits by itself ends
  # the container, as before.
  ioc:
    image: mist2-ioc:dev
    init: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        trigger=/case/build/ioc-restart
        trap 'kill $$pid 2>/dev/null; exit 0' TERM INT
        while true; do
          seen=$$(cat $$trigger 2>/dev/null)
          /opt/mist2/EPICS/ioc/bin/linux-x86_64/mist2 /devtest/st.cmd &
          pid=$$!
          while kill -0 $$pid 2>/dev/null; do
            sleep 0.2
            if [ "$$(cat $$trigger 2>/dev/null)" != "$$seen" ]; then
              kill $$pid; wait $$pid
              echo "devtest: IOC restarted on request"
              continue 2
            fi
          done
          wait $$pid
          exit $$?
        done
    working_dir: /tmp
    environment:
      TOP: /opt/mist2/EPICS/ioc
      MIST2_PORTS: sim
      CASE_DIR: /case
      SIM_HOST: sim
    volumes:
      - ${DEVTEST_REPO:?}/EPICS/Db:/opt/mist2/EPICS/Db:ro
      - ${DEVTEST_REPO:?}/emulation/devtest/st.cmd:/devtest/st.cmd:ro
      - ${DEVTEST_CASE:?}:/case:ro

  test:
    <<: *tools
    profiles: ["test"]
    environment:
      <<: *tools-env
      SIM_HOST: sim
      IOC_HOST: ioc
      DEVTEST_BUILD: /case/build
      EPICS_CA_AUTO_ADDR_LIST: "NO"
      EPICS_CA_ADDR_LIST: ioc
