# The definition the tests start from (test_scan.py changes copies of it). Every number is a
# choice for this case's soft records (scan.db), not a property of a machine.
name: devtest
actuator:
  set: "SCAN:x:set"
  readback: "SCAN:x:get"
  tolerance: 0.01
  settle_timeout: 5.0
  settle_time: 0.1
  max_step: 1.0
  step_pause: 0.2
  limits: [-10.0, 10.0]
  on_not_settled: skip
points: {start: -9.0, stop: 9.0, step: 0.5}
detectors:
  - {pv: "SCAN:peaks:get", name: peaks, required: true}
  - {pv: "SCAN:hold:get", name: hold, required: false}
  - {pv: "SCAN:flaky:get", name: flaky, required: false}
dwell: 0.5
conditions:
  - {pv: "SCAN:permit:get", op: "==", value: 1}
end: previous
output: build/out
