# The plant model of MIST-2 (python -m mist2sim.plant --config config/plant.yaml).
#
# A separate process: it reads the actuators of the simulators and writes the process values
# back, through their control ports only. See README.md, section "Plant model".
#
# NOTHING IN THE SECTION `model` IS A MEASURED PROPERTY OF MIST-2. Known about the machine are
# only the supply ratings and what plan/controls.yaml says. Every other number is a physical law,
# an order-of-magnitude estimate or a free choice, and `source` says which.

rate_hz: 10              # model steps per second
log_period_s: 10.0       # one status line every so many seconds; the plant never logs more than one line per second
retry_s: 2.0             # a simulator that is not there is tried again after this time
timeout_s: 0.5           # connect and reply timeout of one control port

# The plant's own control port (get the model state, set disturbances).
control: {host: 0.0.0.0, port: 6090}

# Control ports of the simulators (config/rack.yaml and config/hv.yaml: port + 1000).
links:
  tdk:          {host: sim-hv, port: 6001}
  rek:          {host: sim-hv, port: 6019}
  thermocouple: {host: sim-hv, port: 6020}
  aim:          {host: sim-rack, port: 6003}
  gauges:       {host: sim-rack, port: 6006}
  mat_opt:      {host: sim-rack, port: 6008}
  sensorbox:    {host: sim-rack, port: 6010}
  valvebox:     {host: sim-rack, port: 6012}
  mfc:          {host: sim-rack, port: 6013}
  faradaycup:   {host: sim-rack, port: 6030}
  nt20_1:       {host: sim-rack, port: 6032}
  nt20_2:       {host: sim-rack, port: 6033}

# What the plant reads: model input <- <simulator>.<signal>, times `scale`.
inputs:
  filament_current: {signal: tdk.mc}                     # A, measured output current
  rek_vset:         {signal: rek.1.vset}                 # V
  rek_iset:         {signal: rek.1.iset}                 # A
  rek_on:           {signal: rek.1.output}
  gas_flow:         {signal: mfc.254.flow, scale: 0.5}   # % of full scale -> sccm (full scale 50 sccm, rack.yaml)
  foreline_open:    {signal: valvebox.s1}
  shutoff_open:     {signal: valvebox.s2}
  vent_open:        {signal: valvebox.s3}
  cup_in:           {signal: valvebox.s4}
  turbo1_speed:     {signal: nt20_1.speed, scale: 8.333333e-4}   # Hz -> fraction of 1200 Hz (rack.yaml)
  turbo2_speed:     {signal: nt20_2.speed, scale: 8.333333e-4}
  source_vset:      {signal: mat_opt.1.vset}             # V, ion source supply AU20P15
  source_iset:      {signal: mat_opt.1.iset}             # A
  source_on:        {signal: mat_opt.1.output}
  puller_voltage:   {signal: mat_opt.2.vout}             # V (magnitude), puller supply AU20N7.5
  puller_on:        {signal: mat_opt.2.output}

# What the plant drives: <simulator>.<signal> <- model output (thermocouples and
# water_temperatures: one entry per channel of the model parameter tc_base_c / water_base_c).
outputs:
  tdk.load_ohm:        filament_resistance
  rek.1.load_ohm:      rek_load
  mat_opt.1.load_ohm:  source_load
  aim.pressure:        source_pressure       # source ion gauge (nAIM), torr
  gauges.p2:           diag_pressure         # diagnostic box gauge (AIM on the gauge controller), torr
  gauges.p1:           foreline_pressure     # foreline gauge (APG), torr
  faradaycup.c1:       cup_current           # A
  thermocouple.t1:     thermocouples.t1      # deg C
  thermocouple.t2:     thermocouples.t2
  thermocouple.t3:     thermocouples.t3
  thermocouple.t4:     thermocouples.t4
  sensorbox.t1:        water_temperatures.t1
  sensorbox.t2:        water_temperatures.t2
  sensorbox.t3:        water_temperatures.t3
  sensorbox.t4:        water_temperatures.t4
  sensorbox.t5:        water_temperatures.t5
  sensorbox.t6:        water_temperatures.t6
  sensorbox.t7:        water_temperatures.t7

# The model. Every entry: value, unit, source (law / estimate / free choice, and why).
model:
  # --- 1. filament ----------------------------------------------------------------------------
  filament_tau_s:          {value: 1.0, unit: s, source: "free choice: 'about a second, which matches a thermal filament' (plan/controls.yaml, software.loops)"}
  filament_r_hot_ohm:      {value: 0.025, unit: ohm, source: "estimate: the hot filament assumed by the TDK simulator (hv.yaml load_ohm)"}
  filament_t_hot_k:        {value: 2600.0, unit: K, source: "estimate: a usual temperature of an emitting tungsten filament"}
  filament_r_exponent:     {value: 1.2, unit: "1", source: "law (fit): tungsten resistivity rises about as T^1.2 between 300 and 3000 K"}
  filament_area_cm2:       {value: 13.0, unit: cm2, source: "estimate: chosen so that about 1 kW (200 A) holds the filament at about 2600 K; also the emitting area"}
  filament_emissivity:     {value: 0.3, unit: "1", source: "law (tabulated): total emissivity of tungsten near 2600 K"}
  room_temperature_k:      {value: 293.0, unit: K, source: "free choice"}
  richardson_a_per_cm2_k2: {value: 60.0, unit: A/(cm2 K2), source: "law (tabulated): Richardson constant of tungsten"}
  work_function_ev:        {value: 4.54, unit: eV, source: "law (tabulated): work function of tungsten"}
  # --- 2. discharge ---------------------------------------------------------------------------
  discharge_v_min_v:       {value: 25.0, unit: V, source: "estimate: no discharge below this voltage (H2 ionisation 15.4 V plus margin)"}
  discharge_k_a_per_v15:   {value: 0.04, unit: A/V^1.5, source: "estimate: the plasma carries about 20 A at 100 V and 5 sccm, near the REK rating (24 A)"}
  discharge_exponent:      {value: 1.5, unit: "1", source: "law (shape only): space-charge limited current rises as V^1.5 (Child-Langmuir)"}
  discharge_p_min_torr:    {value: 5.0e-4, unit: torr, source: "estimate: no discharge below this plasma chamber pressure"}
  discharge_p_half_torr:   {value: 2.0e-3, unit: torr, source: "estimate: the plasma limit is half its maximum at p_min + p_half"}
  discharge_smooth_n:      {value: 3.0, unit: "1", source: "free choice: sharpness of the transition from emission limit to plasma limit"}
  rek_bleed_ohm:           {value: 1.0e+4, unit: ohm, source: "free choice: a bleeder across the REK output, so that its current limit always has a load to act on"}
  # --- 3. gas and vacuum ----------------------------------------------------------------------
  sccm_to_torr_l_s:        {value: 0.01267, unit: torr l/s per sccm, source: "law: definition of the sccm (760 torr, 0 degC)"}
  aperture_conductance_l_s: {value: 8.0, unit: l/s, source: "estimate: molecular flow of H2 through an extraction aperture of about 5 mm"}
  chamber_volume_l:        {value: 2.0, unit: l, source: "estimate: plasma chamber"}
  source_volume_l:         {value: 50.0, unit: l, source: "estimate: source vacuum vessel"}
  diag_volume_l:           {value: 30.0, unit: l, source: "estimate: diagnostic box"}
  beamline_conductance_l_s: {value: 5.0, unit: l/s, source: "estimate: between source vessel and diagnostic box"}
  turbo_speed_l_s:         {value: 200.0, unit: l/s, source: "estimate: H2 pumping speed of each turbopump at rated speed (the pump models are not known)"}
  turbo_stopped_fraction:  {value: 0.01, unit: "1", source: "estimate: what a stopped turbopump still pumps (through to the foreline)"}
  turbo_p_limit_torr:      {value: 0.01, unit: torr, source: "estimate: inlet pressure at which a turbopump has lost half its speed"}
  source_base_torr:        {value: 2.0e-6, unit: torr, source: "free choice: the constant of the aim simulator today (rack.yaml), base pressure with pumps at speed"}
  diag_base_torr:          {value: 8.0e-7, unit: torr, source: "free choice: the constant of gauges p2 today (rack.yaml)"}
  foreline_base_torr:      {value: 3.0e-2, unit: torr, source: "free choice: the constant of gauges p1 today (rack.yaml)"}
  foreline_volume_l:       {value: 2.0, unit: l, source: "estimate: foreline between turbopumps and foreline valve (the gauge is assumed there)"}
  rough_speed_l_s:         {value: 5.0, unit: l/s, source: "estimate: roughing pump (make and model not known)"}
  foreline_outgas_torr_l_s: {value: 1.0e-3, unit: torr l/s, source: "estimate: outgassing of the foreline"}
  vent_conductance_l_s:    {value: 10.0, unit: l/s, source: "estimate: vent valve into the source vessel"}
  atmosphere_torr:         {value: 760.0, unit: torr, source: "law"}
  burst_tau_s:             {value: 2.0, unit: s, source: "free choice: decay of a pressure burst set through the plant's control port"}
  # --- 4. extraction --------------------------------------------------------------------------
  beam_fraction:           {value: 2.0e-4, unit: A/A, source: "estimate: extracted beam current per A of discharge current at saturation (10 A -> 2 mA, within the 15 mA source supply)"}
  extraction_v_sat_v:      {value: 8000.0, unit: V, source: "estimate: the beam current rises as 1 - exp(-V / v_sat) with the extraction voltage (source + puller)"}
  source_leak_ohm:         {value: 2.0e+8, unit: ohm, source: "free choice: leakage of the source supply output, 100 uA at 20 kV"}
  # --- 5. heat --------------------------------------------------------------------------------
  tc_tau_s:                {value: 20.0, unit: s, source: "free choice: minutes in reality, short so that a desk session sees an effect within a minute"}
  tc_gain_k_per_w:         {value: 0.01, unit: K/W, source: "estimate: 3 kW of filament and discharge power heat the source plates by 30 K"}
  tc_base_c:               {value: {t1: 35.0, t2: 41.0, t3: 38.0, t4: 33.0}, unit: degC, source: "free choice: the constants of the thermocouple simulator today (hv.yaml)"}
  water_tau_s:             {value: 40.0, unit: s, source: "free choice: minutes in reality, short so that a desk session sees an effect within a minute"}
  water_flow_l_min:        {value: 1.0, unit: l/min, source: "estimate: within 0.25 to 2 l/min per branch (plan/controls.yaml)"}
  water_heat_fraction:     {value: 0.3, unit: "1", source: "estimate: share of the heat power each sensor box channel sees (which sensor sits where is not known)"}
  water_cp_j_per_kg_k:     {value: 4186.0, unit: J/(kg K) at 1 kg/l, source: "law: heat capacity of water"}
  water_base_c:            {value: {t1: 24.0, t2: 25.0, t3: 26.0, t4: 27.0, t5: 28.0, t6: 29.0, t7: 30.0}, unit: degC, source: "free choice: the constants of the sensor box simulator today (rack.yaml)"}
