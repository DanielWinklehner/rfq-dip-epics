# Simulators of everything that is cabled to the rack computer (container sim-rack).
#
# One entry per serial line, bus or Ethernet device. The asyn port that connects to it is in
# EPICS/ioc/iocBoot/iocRack/ports.sim.cmd. Control port = port + 1000.
# Port numbers follow the lab's old COM numbers where one exists (COM6 -> 5006).
#
# Values marked ASSUMED are not from a document. They are listed in docs/emulation/STATUS.md.

# --- Matsusada AU supplies, optical chain behind the USB-OPT adapter (asyn port mat_opt) ---------
# Four supplies (owner, 2026-11-21): 1 ion source and 2 puller here, 3 lens 1 and 4 lens 2 on mat_co.
- name: mat_opt
  type: matsusada_co
  port: 5008
  baud: 9600
  turnaround_ms: 5            # ASSUMED: not in the CO manual, to be measured on the adapter
  options:
    # ASSUMED: a unit in local control (front panel) still answers queries; STS reports LO then
    queries_without_remote: true
    units:
      - {address: 1, vfs: 20000, ifs: 0.015, load_ohm: 4.0e+6}                  # ion source, AU20P15
      - {address: 2, vfs: 20000, ifs: 0.0075, polarity: "-", load_ohm: 4.0e+6}  # puller, AU20N7.5

# --- Matsusada AU supplies, optical chain behind the CO-U32 adapter (asyn port mat_co) ----------
- name: mat_co
  type: matsusada_co
  port: 5009
  baud: 9600
  turnaround_ms: 5            # ASSUMED
  options:
    queries_without_remote: true   # ASSUMED, as above
    units:
      - {address: 3, vfs: 20000, ifs: 0.0075, load_ohm: 4.0e+6}                 # lens 1, AU20P7.5
      - {address: 4, vfs: 20000, ifs: 0.0075, polarity: "-", load_ohm: 4.0e+6}  # lens 2, AU20N7.5

# --- Edwards nAIM ion gauge, RS-232 (asyn port AIM) ---------------------------------------------
# Deferred by the owner (2026-11-25), flagged not installed in the plan: the rack IOC still loads
# aim.db, and this simulator keeps its PVs valid in the emulation. Nothing drives its pressure.
- name: aim
  type: edwards_naim
  port: 5003
  baud: 9600
  turnaround_ms: 10           # ASSUMED
  options:
    units: torr               # ASSUMED: the unit configured in the gauge (the lab's database says torr)
    pressure: 2.0e-6

# --- Interlock box: two door switches, Arduino Opta, libcom1 (asyn port AVR11) ------------------
# AVR/devices/InterlockOpta, in place of the lost Arduino Mega box (owner, 2026-11-24, answer 54),
# with the old box's channels: i1, i2: the doors as the Opta reports them, 1 = closed (a door
# counts as closed only after its input has read closed for 1 s; that hold time is the
# firmware's and is not modelled here: the value of i1, i2 is what the firmware reports). A set
# is accepted and ignored. s1, s2: the Opta's relays 3 and 4, not used by any database.
# The interlock contacts (relays 1 and 2) have no channel. Compared line by line with the
# firmware: make -C AVR/devices/InterlockOpta/tests (tools/interlock_replay.py).
- name: interlockbox
  type: libcom1
  port: 5011
  baud: 115200
  bits_per_char: 10           # USB serial of the Opta: changes nothing on the wire, sets the delay
  turnaround_ms: 1            # ASSUMED
  in_terminator: "\n"
  out_terminator: "\r\n"      # Serial.println
  options:
    identity: InterlockOpta
    firmware: "Nov 21 2026"   # the sketch reports __DATE__: placeholder
    number_format: g          # Opta (ARM): snprintf %g, not the AVR format
    out_buffer: 128
    in_buffer: 128
    channels:
      - {id: i1, access: rw, behaviour: constant, value: 1}
      - {id: i2, access: rw, behaviour: constant, value: 1}
      - {id: s1, access: rw, behaviour: relay}
      - {id: s2, access: rw, behaviour: relay}

# --- Solenoid valve box, 8 relays, Arduino Mega, libcom1 (asyn port AVR12) ----------------------
# s1 foreline valve, s2 MFC shutoff, s3 vent valve, s4 Faraday cup actuator, s5 to s8 spare
- name: valvebox
  type: libcom1
  port: 5012
  baud: 115200
  bits_per_char: 10
  turnaround_ms: 1            # ASSUMED
  in_terminator: "\n"
  out_terminator: "\r\n"
  options:
    identity: SolenoidValveBox
    firmware: "Nov 21 2026"
    number_format: avr
    out_buffer: 160
    in_buffer: 128
    channels:
      - {id: s1, access: rw, behaviour: relay}
      - {id: s2, access: rw, behaviour: relay}
      - {id: s3, access: rw, behaviour: relay}
      - {id: s4, access: rw, behaviour: relay}
      - {id: s5, access: rw, behaviour: relay}
      - {id: s6, access: rw, behaviour: relay}
      - {id: s7, access: rw, behaviour: relay}
      - {id: s8, access: rw, behaviour: relay}

# --- MKS GV50A mass flow controller, RS-485 (asyn port MFC) -------------------------------------
- name: mfc
  type: mks_rs485
  port: 5013
  baud: 9600
  turnaround_ms: 5            # ASSUMED, not in the MKS supplement
  options:
    units:
      # 5 sccm full scale, calibrated for hydrogen (owner, 2026-11-21)
      - {address: 254, full_scale: 5.0, flow_units: SCCM, gas: H2, tau_s: 1.0}

# --- Faraday cup readout, Arduino Opta on USB serial, libcom1 protocol 1 (asyn port AVR16) -------
# The lab's IOC.faraday.db and st.cmd (reference/lab-2026): COM16, 115200 8N1, two values i1, i2.
# Protocol 1: the library on the rack computer had no protocol 2 (reference/lab-2026/README.md).
# NOT KNOWN: the sketch, the channel identifiers, what i1 and i2 are and their unit. ASSUMED here:
# channels i1, i2 (the record names); i1 is the cup current in A, driven by the plant model
# (plant.yaml); i2 is a constant 0.
- name: faradaycup
  type: libcom1
  port: 5016
  baud: 115200
  bits_per_char: 10           # 8N1 as ports.real.cmd opens the port; an Opta's USB serial ignores it
  turnaround_ms: 1            # ASSUMED
  in_terminator: "\n"
  out_terminator: "\r\n"      # Serial.println, as in the lab's sketches (ASSUMED for this one)
  options:
    protocol: 1
    number_format: g          # %g, Arduino Opta (ARM)
    out_buffer: 128           # ASSUMED, as the flow meter sketch
    in_buffer: 128
    channels:
      - {id: i1, access: rw, behaviour: analog, value: 1.0e-6, noise: 2.0e-9}   # ASSUMED: cup current, A
      - {id: i2, access: rw, behaviour: constant, value: 0.0}                   # ASSUMED: meaning unknown

# --- Cooling water flow meters, Arduino Opta on USB serial, libcom1 protocol 1 (asyn port AVR23) -
# reference/lab-2026/AVR/devices/FlowMeters/FlowMeters.ino and the lab's st.cmd: COM23, 115200 8N1,
# five channels f1..f5 in l/min (pulses of 0.5 s times 0.095238), each with a dummy setter (rw).
# Which circuit each meter is: not known. The values are a free choice within 0.25 to 2 l/min
# per branch (plan/controls.yaml), in steps of one pulse per 0.5 s.
- name: flowmeters
  type: libcom1
  port: 5023
  baud: 115200
  bits_per_char: 10           # 8N1 as ports.real.cmd opens the port; an Opta's USB serial ignores it
  turnaround_ms: 1            # ASSUMED
  in_terminator: "\n"          # Serial.readBytesUntil('\n')
  out_terminator: "\r\n"      # Serial.println
  options:
    protocol: 1
    number_format: g          # %g, Arduino Opta (ARM)
    out_buffer: 128           # IOHandler<128>, SerialDevice<128, 5>
    in_buffer: 128            # serial_in_buffer[128], readBytesUntil(..., 127)
    channels:
      - {id: f1, access: rw, behaviour: analog, value: 1.0, noise: 0.05, lo: 0, step: 0.095238}
      - {id: f2, access: rw, behaviour: analog, value: 1.0, noise: 0.05, lo: 0, step: 0.095238}
      - {id: f3, access: rw, behaviour: analog, value: 1.0, noise: 0.05, lo: 0, step: 0.095238}
      - {id: f4, access: rw, behaviour: analog, value: 1.0, noise: 0.05, lo: 0, step: 0.095238}
      - {id: f5, access: rw, behaviour: analog, value: 1.0, noise: 0.05, lo: 0, step: 0.095238}

# --- Turbopump Opta: run relays and status contacts of both NT 20 (asyn port TURBO) -------------
# Channel map as defined in EPICS/Db/turbo.db. The contacts are driven by nt20_1 and nt20_2.
- name: turbo_opta
  type: libcom1
  port: 5031
  baud: 115200                # TCP: only sets the reply delay of the simulator
  turnaround_ms: 1
  in_terminator: "\n"
  out_terminator: "\n"
  options:
    identity: TurboOpta
    firmware: "placeholder"
    number_format: g
    channels:
      - {id: r1, behaviour: relay}
      - {id: r2, behaviour: relay}
      - {id: r3, behaviour: relay}
      - {id: r4, behaviour: relay}
      - {id: n1, access: r}
      - {id: a1, access: r}
      - {id: f1, access: r}
      - {id: n2, access: r}
      - {id: a2, access: r}
      - {id: f2, access: r}

# --- Leybold NT 20, RS-232 data output, talk only (asyn ports NT20_1, NT20_2) -------------------
# The record format is INVENTED, see EPICS/Db/nt20_monitor.proto.
# Run-up and run-down are shorter than a real pump's, so that a desk session does not wait.
- name: nt20_1
  type: nt20_monitor
  port: 5032
  baud: 9600
  out_terminator: "\r\n"      # ASSUMED
  options: &pump
    period_s: 8.0
    rated_speed_hz: 600.0     # TURBOVAC 1000 C (owner: "I think"): 36,000 rpm, GA 05.118/14.02
    ramp_up_s: 60.0           # ASSUMED
    run_down_s: 120.0         # ASSUMED
    brake_s: 30.0             # ASSUMED
    opta_host: 127.0.0.1      # turbo_opta runs in the same process
    opta_port: 6031           # its control port
    run_signal: r1
    normal_signal: n1
    accel_signal: a1
    failure_signal: f1
- name: nt20_2
  type: nt20_monitor
  port: 5033
  baud: 9600
  out_terminator: "\r\n"
  options:
    <<: *pump
    run_signal: r2
    normal_signal: n2
    accel_signal: a2
    failure_signal: f2

# --- INFICON VGC401, the foreline gauge's controller, RS-232 (asyn port VGC), task T30 ----------
# Read only. On the roughing line, the turbopump's foreline (owner, 2026-11-25); the plant model's
# foreline pressure drives it (config/plant.yaml). Seen on the lab's controller (2026-11-25, lab
# session): 9600 baud, gauge head PCG, unit Torr, firmware 302-519-D, a reply after 91 to 112 ms.
# ASSUMED: the PCG's measuring range, 5e-5 to 1500 mbar (INFICON's data sheet of the PCG550, as
# remembered, not read for this task), and that the controller then reports underrange or
# overrange with the end of the range as its value (the manual gives neither).
- name: vgc401
  type: inficon_vgc401
  port: 5034
  baud: 9600
  turnaround_ms: 95           # seen on the lab's controller: 91 to 112 ms per reply (2026-11-25)
  options:
    gauge: PCG                # seen: TID answers PCG
    unit: 1                   # seen: Torr (UNI answers 1)
    firmware: "302-519-D"     # seen: PNR
    pressure: 0.03            # torr, without the plant model
    range_torr: [3.75e-5, 1125.0]   # ASSUMED: 5e-5 to 1500 mbar
    continuous: true          # sends by itself after power-on until the first character (p. 55)

# --- Edwards TIC station, RS-232 (asyn port TIC), task T29 --------------------------------------
# Read only. As the lab's station reports itself (2026-11-25, lab session): a TIC Turbo and
# Instrument Controller (TIC100) with an EXT75DX turbopump and a mains backing pump. Both pumps
# run here, so that every PV has a value while nothing is at fault (the real cart's state is
# whatever the owner set at its panel).
# The gauges (owner, 2026-11-25; task T31): socket 1 the APG100-XM, socket 2 a regular AIM, both
# on the six-way cross; socket 3 empty (plan: device tic, channel gauge3 not installed). The plant
# model drives both (config/plant.yaml): the APG with the true cross pressure (the simulator
# clamps it to the gauge's ends), the AIM with its reading; without the plant they read the
# values below.
#   APG: seen on the lab's TIC to report exactly 1.0000e-02 Pa at high vacuum and exactly
#   1.0000e+05 Pa at atmosphere, always in the state On (floor_pa, top_pa).
#   AIM: seen at atmosphere in the state 5 "Off", units 59, alert 0, priority 0. The owner's rule
#   (2026-11-25): not on until the APG shows 1e-2 torr or lower (on_torr). Who switches it on is
#   not seen (the TIC's own slave setup, D397-30-880 Table 1 object 914, or the owner at the
#   panel); here the TIC does, by socket 1's value. ASSUMED: off again above 2e-2 torr
#   (off_torr) and 3 s in the state 6 "Striking" (strike_s): neither is seen nor in a manual read.
- name: tic
  type: edwards_tic
  port: 5035
  baud: 9600
  turnaround_ms: 20           # ASSUMED: the manual says less than 100 ms
  options:
    variant: TIC
    gauges:
      - {pressure: 4.3e-6, floor_pa: 1.0e-2, top_pa: 1.0e+5}          # APG100-XM: true pressure, it reports its floor
      - {pressure: 2.0e-6,                                             # AIM, at the base reading
         switch: {master: 1, on_torr: 1.0e-2, off_torr: 2.0e-2, strike_s: 3.0}}
      - null                                                           # socket 3: empty
    turbo_type: 3             # EXT75DX Pump, as the lab's cart reports (2026-11-25)
    backing_type: 8           # Mains Backing Pump (D397-30-880 1.7.11)
    backing_state: 4          # On State (1.7.6)
