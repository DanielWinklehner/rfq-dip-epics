# MIST-2 emulation: two control computers, the rack IOC and the platform IOC each with its own
# address, and the loop IOC, which runs on the platform computer in reality (docs/emulation/LOOP.md).
# Use through the Makefile (make -C emulation up), see README.md.
name: mist2emu

x-ioc: &ioc
  image: mist2-ioc:dev
  init: true            # signals reach the IOC (docker stop), zombie reaping
  stdin_open: true      # docker attach gives the IOC shell (detach: ctrl-p ctrl-q)
  tty: true
  restart: "no"
  environment:
    MIST2_PORTS: sim
    MIST2_SAVE: /var/lib/mist2/save
  volumes:
    # Edits need only `make -C emulation restart`, no image build.
    - ../EPICS/Db:/opt/mist2/EPICS/Db:ro
    - ../EPICS/ioc/iocBoot:/opt/mist2/EPICS/ioc/iocBoot:ro
    # Files the IOCs write at run time (autosave: the limits), one subdirectory per IOC, in the
    # named volume mist2emu-save: it survives restart and down/up (not `down -v`). See README.md.
    - save:/var/lib/mist2/save

x-sim: &sim
  image: mist2-tools:dev
  init: true
  restart: "no"
  user: "${MIST2_UID:-1000}:${MIST2_GID:-1000}"
  working_dir: /repo/emulation/sim
  entrypoint: []
  environment:
    HOME: /tmp
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"
  volumes:
    - ..:/repo:ro
  tmpfs:
    - /run/mist2sim

# Healthy when every simulator of the container listens (the ready file). The IOCs wait for that:
# an IOC that finds a port closed at its start tries it again only 20 s later (asyn).
# The file is on a tmpfs, so a container that starts again never finds an old one.
x-sim-ready: &sim-ready
  test: ["CMD", "test", "-f", "/run/mist2sim/ready"]
  interval: 30s
  timeout: 2s
  start_period: 20s
  start_interval: 200ms
  retries: 2

services:
  ioc-rack:
    <<: *ioc
    hostname: ioc-rack
    depends_on: {sim-rack: {condition: service_healthy}}
    command: ["iocRack", "sim"]
    networks:
      mist2ctl:
        ipv4_address: ${MIST2_SUBNET:-172.30.0}.11
    healthcheck:
      test: ["CMD", "env", "EPICS_CA_AUTO_ADDR_LIST=NO", "EPICS_CA_ADDR_LIST=127.0.0.1",
             "caget", "-w", "2", "IOC-RACK:heartbeat"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 3

  ioc-hv:
    <<: *ioc
    hostname: ioc-hv
    depends_on: {sim-hv: {condition: service_healthy}}
    command: ["iocHV", "sim"]
    networks:
      mist2ctl:
        ipv4_address: ${MIST2_SUBNET:-172.30.0}.12
    healthcheck:
      test: ["CMD", "env", "EPICS_CA_AUTO_ADDR_LIST=NO", "EPICS_CA_ADDR_LIST=127.0.0.1",
             "caget", "-w", "2", "IOC-HV:heartbeat"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 3

  # The loop IOC: no hardware, Channel Access only. It starts whether or not the other IOCs run,
  # so it waits for nobody. On the real platform computer it shares the host with iocHV.
  ioc-loop:
    <<: *ioc
    hostname: ioc-loop
    command: ["iocLoop", "sim"]
    networks:
      mist2ctl:
        ipv4_address: ${MIST2_SUBNET:-172.30.0}.13
    healthcheck:
      test: ["CMD", "env", "EPICS_CA_AUTO_ADDR_LIST=NO", "EPICS_CA_ADDR_LIST=127.0.0.1",
             "caget", "-w", "2", "IOC-LOOP:heartbeat"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 1s
      retries: 3

  # One simulator container per emulated computer: everything that is cabled to that computer.
  # Address .30 is reserved for the plant model.
  sim-rack:
    <<: *sim
    hostname: sim-rack
    healthcheck: *sim-ready
    command: ["python", "-m", "mist2sim", "--config", "config/rack.yaml",
              "--ready-file", "/run/mist2sim/ready"]
    networks:
      mist2ctl:
        ipv4_address: ${MIST2_SUBNET:-172.30.0}.21

  sim-hv:
    <<: *sim
    hostname: sim-hv
    healthcheck: *sim-ready
    command: ["python", "-m", "mist2sim", "--config", "config/hv.yaml",
              "--ready-file", "/run/mist2sim/ready"]
    networks:
      mist2ctl:
        ipv4_address: ${MIST2_SUBNET:-172.30.0}.22

  # Plant model: reads the actuators of both simulator containers and drives their process
  # values through the control ports. Only with the profile `plant` (make -C emulation up-plant),
  # so that the emulation without the profile behaves as before. See sim/README.md.
  plant:
    <<: *sim
    profiles: ["plant"]
    hostname: plant
    depends_on: {sim-rack: {condition: service_healthy}, sim-hv: {condition: service_healthy}}
    command: ["python", "-m", "mist2sim.plant", "--config", "config/plant.yaml"]
    networks:
      mist2ctl:
        ipv4_address: ${MIST2_SUBNET:-172.30.0}.30

  tools:
    profiles: ["tools"]
    image: mist2-tools:dev
    user: "${MIST2_UID:-1000}:${MIST2_GID:-1000}"   # files written into /repo belong to the host user
    working_dir: /repo
    entrypoint: []
    command: ["bash"]
    environment:
      HOME: /tmp
      PYTHONPATH: /repo/emulation/sim
      PYTHONDONTWRITEBYTECODE: "1"
      EPICS_CA_AUTO_ADDR_LIST: "NO"
      EPICS_CA_ADDR_LIST: ${MIST2_SUBNET:-172.30.0}.255
    volumes:
      - ..:/repo
    networks:
      - mist2ctl

volumes:
  save:
    name: mist2emu-save

networks:
  mist2ctl:
    name: mist2ctl
    driver: bridge
    ipam:
      config:
        - subnet: ${MIST2_SUBNET:-172.30.0}.0/24
          # Containers without a fixed address get one from the upper half, so .1 to .127
          # stay free for fixed addresses (IOCs .11 .12 .13, simulators .21 .22 .30).
          ip_range: ${MIST2_SUBNET:-172.30.0}.128/25
