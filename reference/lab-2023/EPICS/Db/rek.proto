# Author: Philip Weigel

Terminator = CR;

# Voltage (Hex)
set_voltage {
    out "#\$1 CH0 %04X";
}

get_voltage {
    out "#\$1 CH0?";
    in "CH0=%XH"
}

read_voltage {
    out "#\$1 MN1";
    in "MONI1=%XH";
}


# Current (Hex)
set_current {
    out "#\$1 CH1 %04X";
}

get_current {
    out "#\$1 CH1?";
    in "CH1=%XH"
}

read_current {
    out "#\$1 MN2";
    in "MONI2=%XH";
}

# Status
enable_remote_control {
	out "#\$1 REN";
}

get_output_status {
	out "#\$1 SW?";
	in "SW%d";
}

toggle_output {
	out "#\$1 ICN %{0|100}";  # 0%/100% current output
	out "#\$1 RST";  # Reset cut off state
	out "#\$1 SW%{0|1}";  # Switch output to off/on
	
	@init {
		out "#\$1 REN";  # Enable remote control
		out "#\$1 SW?";  # Request output status
		in "SW%d";  # Read status
	}
}

