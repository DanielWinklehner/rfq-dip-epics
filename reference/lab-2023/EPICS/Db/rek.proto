read_status {
    out "#\$1 STS";
 
    # STS outputs the status of remote control, as the last parmeter, 
    # but since we always turn it on in the on cmd and never turn it off,
    # it is unneeded.
    in "#%*d %{CF|CO} %*c%*c %*c%*c";
}



