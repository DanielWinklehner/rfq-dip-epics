# rek.proto - the REK supply behind a CO series controller (CO-U32, CO-RG).
# Identical to matsusada_co_ctrl.proto except for this header.
#
# Protocol: CO series instruction manual rev 0.4, chapters 5 and 7
#   https://wiki.jlab.org/ciswiki/images/5/5b/CO_series_REV_0.4.pdf
# Hex mode: set points 16 bit (CH0/CH1, CHn?), monitors 12 bit (MN1/MN2).
# Set commands get NO reply. Every set is therefore followed by a read of its setting and
# compared with what was sent (%=): a supply that does not execute the set, or does not
# answer, turns the set-point record INVALID (CALC or TIMEOUT).
# The set points have no @init: StreamDevice 2.8.26 converts a LONG input of an ao record with
# ASLO only, not ESLO (devaoStream.c, readData). The database does it instead: at the first
# contact the voltage set point takes over the setting the supply reports (:voltage:get), and
# the saved current limit is sent.
#
# Argument $1 is the unit number (the UNIT switch of the CO-HV).
#
# Authors: Ryan Yang (ryang2@mit.edu), 2021; reworked for MIST-2 in 2026.
# rek.proto is the same file for the REK supply (loaded by rek.db): keep both in step.

Terminator = CR;

# All supplies of a chain share one 9600 baud line, so a supply that does not answer must not
# hold it long. A reply takes 17 to 19 ms plus the adapter's turnaround (5 to 16 ms). 150 ms
# leaves four times that. The supplies of a chain share the line evenly, so while one of two is
# silent (150 ms timeout + 50 ms wait per request) the other keeps about 1.4 updates per second
# (the default 1000 ms: 0.3).
ReplyTimeout = 150;
ReadTimeout = 50;
# A record waits at most this long for the line. Each supply has at most one monitor, one status
# and two echo reads queued, so even a chain of three silent supplies is through its queue in
# about 2 s; a disconnected chain turns the records INVALID within 3 s (default 5000 ms).
LockTimeout = 3000;

# After a reply timeout keep the line 50 ms longer: a reply that comes late then arrives before
# the next request and is discarded (StreamDevice flushes old input before every write) instead
# of being taken as the reply to the next request, possibly of another supply.
@replytimeout { wait 50; }

# Voltage (hex)
set_voltage {
    out "#\$1 CH0 %04X";
    out "#\$1 CH0?";
    in "CH0=%=04XH";
}

get_voltage {
    out "#\$1 CH0?";
    in "CH0=%XH";
}

read_voltage {
    out "#\$1 MN1";
    in "MONI1=%XH";
}

# Current (hex)
set_current {
    out "#\$1 CH1 %04X";
    out "#\$1 CH1?";
    in "CH1=%=04XH";
}

get_current {
    out "#\$1 CH1?";
    in "CH1=%XH";
}

read_current {
    out "#\$1 MN2";
    in "MONI2=%XH";
}

# Switching, as in manual 6-7: on = REN, the current limit (CH1, instead of the manual's
# "ICN 100"), RST, SW1; off = REN, RST, SW0. The REN and the limit come from switch_on_limit or
# remote (records _out:limit, _out:remote), then toggle_output: RST (cancel a cut-off), SW, and
# the SW setting read back and compared. $2 of switch_on_limit is the PV prefix of the supply.
switch_on_limit {
    out "#\$1 REN";
    out "#\$1 CH1 %(\$2current:limit.RVAL)04X";
}

remote {
    out "#\$1 REN";
}

toggle_output {
    out "#\$1 RST";
    out "#\$1 SW%{0|1}";
    out "#\$1 SW?";
    in "SW%={0|1}";
}

# First contact after the IOC start: remote control on, and the SW setting.
probe {
    out "#\$1 REN";
    out "#\$1 SW?";
    in "SW%d";
}

get_output_status {
    out "#\$1 SW?";
    in "SW%d";
}

# Output really on (CO) or off (CF), differs from SW? after a cut-off; remote (RM) or local
# (LO). Values 0 to 3 for the mbbi. No REN: the front panel may have taken local control.
read_status {
    out "#\$1 STS";
    in "#\$1 %{CF RM|CO RM|CF LO|CO LO}";
}

# All units of the chain off (manual 5-2, multiple command). No reply.
all_off {
    out "#AL SW0";
}
