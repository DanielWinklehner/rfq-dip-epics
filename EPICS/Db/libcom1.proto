# libcom1.proto
#
# Requires:
# - Nothing special for the recommended entries below: they use plain %g numbers and work
#   with an unmodified StreamDevice.
# - StreamDevice compiled with LibCom1ExponentConverter ONLY for the legacy com1_getLink.
#
# This file provides a protocol for communicating with a libcom1 device.
# It is the same over a serial port (drvAsynSerialPortConfigure) and over TCP
# (drvAsynIPPortConfigure), only the asyn port differs.
#
# Author(s): Ryan Yang (ryang2@mit.edu)
#
# Changlog:
# 2026/11/20 - Added com1_get, acknowledged sets, identity and streaming (libcom1 protocol 2)
# 2021/05/23 - Documentation
# 2020/04/21 - Added reading in as array
# 2020/11/02 - Added rudimentory way to read multiple values from device


# Devices end lines with LF (TCP) or CR LF (Serial.println). The entries below ignore
# whatever follows the parsed reply, so both work with LF as the terminator.
Terminator = LF;


#################################################################################################
# Reading
#################################################################################################

# Read all channels into an array record (aai), in the order of the channel map in the firmware
read_all_array {
    separator = ":";
    extrainput = ignore;
    out "A";
    in "o%g";
}

# Read one channel:  field(INP, "@libcom1.proto com1_get(a1) $(PORT)")
# Needs libcom1 protocol 2 firmware. No limit on the exponent, nan and inf are passed on.
com1_get {
    extrainput = ignore;
    # g<channel>
    out "g\$1";
    # o<value>
    in "o%g";
}

# Rudimentory methods to read multiple values from device
read_all_3val {
    out "A";
    in "o%g:%(\$1)g:%(\$2)g";
}

read_all_3val_iointr {
    in "o%g:%(\$1)g:%(\$2)g";
}

# LEGACY single read, needs the custom %z converter (LibCom1ExponentConverter).
# Limited to values between 1e-9 and 9.99e9: the device answers ERR6 outside that range.
# Prefer com1_get.
com1_getLink {
    # q01<chanelnum><precision>
    out "q01\$1\$2";

    # o<channelnum><com1exponent>
    # %z is custom defined by LibCom1ExponentConverter
    in "o%*c%*c%z";
}


#################################################################################################
# Writing
#################################################################################################

# Set a value on a channel using a float. The device does not reply, so a rejected
# command (unknown channel, malformed value) goes unnoticed. Prefer the _ack entries.
com1_setLink_flt {
    # s<channel><flt>
    out "s\$1%f";
}

# Set a value on a channel using an integer
com1_setLink {
    out "s\$1%d";
}

# Acknowledged sets: the device answers "ok", or "ERR<n>" which puts the record into alarm
# (INVALID/CALC). No answer at all gives INVALID/TIMEOUT.
# Need libcom1 protocol 2 firmware: older firmware answers ERR0 and does not execute the set.
com1_setLink_flt_ack {
    extrainput = ignore;
    # S<channel><flt>
    out "S\$1%f";
    in "ok";
}

com1_setLink_ack {
    extrainput = ignore;
    out "S\$1%d";
    in "ok";
}


#################################################################################################
# Identity:  record(stringin, ...) { field(INP, "@libcom1.proto com1_identify $(PORT)") }
#################################################################################################

# Reply: oID=<name>;FW=<version>;PROTO=<n>;CH=<channel list>
# Reads the device name, to check that the expected device is on this port
# (COM port numbers change, IP addresses get reassigned).
com1_identify {
    extrainput = ignore;
    out "I";
    in "oID=%39[^;]";
}

# Firmware version (the build date in the sketches of this repository)
com1_firmware {
    extrainput = ignore;
    out "I";
    in "oID=%*[^;];FW=%39[^;]";
}

# Channel list, e.g. "i1,i2,s1,s2". Compare it with what the database expects: the array
# from read_all_array is positional, so a reordered channel map silently shifts every PV.
com1_channels {
    extrainput = ignore;
    out "I";
    in "oID=%*[^;];FW=%*[^;];PROTO=%*d;CH=%39[0-9a-zA-Z,]";
}


#################################################################################################
# Streaming: the device sends all channels on its own at a fixed rate
#################################################################################################

# Stream period in ms, 0 = off:  record(longout, ...) { field(OUT, "@libcom1.proto com1_stream_period $(PORT)") }
com1_stream_period {
    extrainput = ignore;
    out "P%d";
    in "ok";
}

# Stream frames into an array record (aai) with SCAN = "I/O Intr":
#   t<seq>:<device ms>:<v1>:...:<vN>
# Element 0 is the frame counter (wraps at 65535), element 1 the device time in ms,
# the channels follow from element 2. A jump in element 0 means lost frames.
read_stream_array {
    separator = ":";
    extrainput = ignore;
    in "t%g";
}
